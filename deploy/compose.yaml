services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    user: "10002:10002"
    read_only: true
    env_file:
      - ${PRODUCTION_ENV_FILE:-/etc/chaotang-os/production.env}
    environment:
      CHAOTANG_DECREE_JOB_WORKER_ENABLED: "true"
      JINYIWEI_EXTERNAL_NETWORK_ENABLED: "false"
    volumes:
      - /srv/chaotang-os/data:/app/data
      - /srv/chaotang-os/artifacts:/app/artifacts
      - /srv/chaotang-os/accounting:/app/accounting:ro
    expose: ["8000"]
    networks: [app, egress]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    user: "10001:10001"
    read_only: true
    environment:
      BACKEND_BASE_URL: http://backend:8000
    expose: ["3000"]
    networks: [edge, app]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}
    read_only: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/chaotang-os/caddy-data:/data
      - /srv/chaotang-os/caddy-config:/config
    networks: [edge]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
networks:
  edge: {}
  egress: {}
  app:
    internal: true
