name: chaotang-os
services:
  backend:
    image: ${BACKEND_IMAGE:?set digest-pinned BACKEND_IMAGE}
    pull_policy: never
    user: "10002:10002"
    read_only: true
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --workers, "1", --no-access-log]
    env_file:
      - ${PRODUCTION_ENV_FILE:-/etc/chaotang-os/production.env}
    environment:
      CHAOTANG_DECREE_JOB_WORKER_ENABLED: "true"
      JINYIWEI_EXTERNAL_NETWORK_ENABLED: "false"
      CHAOTANG_ACCOUNTING_SOURCE_DIR: /app/accounting
    volumes:
      - /srv/chaotang-os/data:/app/data
      - /srv/chaotang-os/accounting:/app/accounting:ro
    expose: ["8000"]
    networks: [app]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  frontend:
    image: ${FRONTEND_IMAGE:?set digest-pinned FRONTEND_IMAGE}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    environment:
      BACKEND_BASE_URL: http://backend:8000
    expose: ["3000"]
    networks: [edge, app]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  caddy:
    image: ${CADDY_IMAGE:?set digest-pinned CADDY_IMAGE}
    pull_policy: never
    user: "10003:10003"
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /data:rw,noexec,nosuid,nodev,mode=0700,uid=10003,gid=10003
      - /config:rw,noexec,nosuid,nodev,mode=0700,uid=10003,gid=10003
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
networks:
  edge:
    internal: true
  app:
    internal: true
