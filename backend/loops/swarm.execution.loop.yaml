id: swarm_execution_loop_v1
name: 蜂群执行主循环
version: 0.1.0
owner: courtos/swarm
purpose: >
  接收军机处会审计划，自动选择后台专业蜂群，并生成部门分奏、
  证据链、风险表、冲突摘要和合奏材料。蜂群不直接面对用户。

entrypoints:
  - junjichu_review_plan_ready
  - resubmit_after_evidence
  - request_deep_swarm_review
  - retry_failed_swarm_run

state_model:
  allowed_states:
    - pending
    - routing
    - running
    - awaiting_evidence
    - auditing
    - conflict_checking
    - synthesizing
    - quality_checking
    - completed
    - failed_with_recovery

source_policy:
  allowed_labels: [LIVE, LIVE_SWARM, MIXED, FALLBACK, DEMO]
  rules:
    - LIVE_SWARM requires a real backend run_id and trace_id.
    - FALLBACK cannot be used as final certainty.
    - DEMO cannot enter real decision.
    - Every swarm output must include source_label.

steps:
  - id: load_review_plan
    name: 读取军机处会审计划
    outputs: [review_plan, confirmed_edict, evidence_summary, wiki_rules]
    gates: [review_plan_must_exist, source_label_required]

  - id: route_swarms
    name: 蜂群路由
    skill: skill.swarm.router
    outputs: [swarm_route_plan]
    gates:
      - user_must_not_select_swarm
      - selected_swarms_must_have_reason
      - high_risk_requires_critic_and_evidence_audit
      - live_swarm_requires_real_backend_enabled

  - id: run_department_swarms
    name: 部门蜂群并行执行
    type: parallel
    outputs: [department_swarm_outputs]
    gates:
      - every_swarm_output_schema_valid
      - every_swarm_output_has_source_label
      - every_claim_has_evidence_or_gap

  - id: run_evidence_audit_swarm
    name: 证据审计蜂群
    skill: skill.swarm.evidence_audit
    outputs: [evidence_audit]
    gates: [unsupported_claims_must_be_marked, no_certainty_without_evidence]

  - id: run_critic_swarm
    name: 反方质疑蜂群
    skill: skill.swarm.critic
    outputs: [critique_report]
    gates: [high_risk_must_be_escalated, weak_claims_must_be_visible]

  - id: detect_conflicts
    name: 分歧识别蜂群
    skill: skill.swarm.conflict_detector
    outputs: [conflict_summary]
    gates: [conflict_must_not_be_hidden, severe_conflict_requires_emperor_question]

  - id: synthesize_swarm_materials
    name: 合成蜂群材料
    skill: skill.swarm.synthesis
    outputs: [swarm_brief_for_junjichu]
    gates: [one_primary_action_required, no_fallback_as_final_certainty]

  - id: quality_gate
    name: 蜂群质门
    skill: skill.swarm.quality_gate
    outputs: [swarm_quality_result, revised_swarm_brief]
    gates:
      - source_label_required
      - high_risk_requires_human_confirmation
      - evidence_or_gap_required_for_key_claims
      - readable_for_ministry_synthesis

  - id: persist_swarm_run
    name: 保存蜂群运行记录
    outputs: [swarm_run_id, trace_id]

  - id: return_to_junjichu
    name: 回传军机处
    outputs: [junjichu_update_status]

  - id: evomap_update
    name: EvoMap 记录蜂群进化信号
    outputs: [evolution_event_id]
