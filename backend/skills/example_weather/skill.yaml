name: "example_weather"
version: "1.0"
description: "天气查询示例 Skill"
author: "蜂群系统"
transport: "stdio"
command: "python3 server.py"
tools:
  - name: "get_weather"
    description: "查询当前天气"
    approval_level: "none"
    parameters:
      type: "object"
      properties:
        city:
          type: "string"
          description: "城市名"
      required: ["city"]
  - name: "get_weather_forecast"
    description: "查询天气预报"
    approval_level: "none"
    parameters:
      type: "object"
      properties:
        city:
          type: "string"
          description: "城市名"
        days:
          type: "integer"
          default: 3
      required: ["city"]
