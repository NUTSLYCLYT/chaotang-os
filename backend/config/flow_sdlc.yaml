flow_name: SDLC开发生命周期流程
default_model: openai/swarm-worker
default_api_key_env: LITELLM_PROXY_KEY
default_api_base: http://127.0.0.1:4444/v1
qa_version: v3
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
output_fields:
- 需求规格说明
- 架构设计
- 代码实现
- 测试报告
- 安全审计报告
steps:
- id: requirements_analyst
  name: 需求澄清分析师
  skill_name: null
  prompt_key: requirements_analyst
  description: 结构化用户需求，输出功能清单、非功能需求、验收标准
  output_rules:
  - sections:
    - 需求背景与目标
    - 功能需求清单
    - 非功能需求
    - 约束条件
    - 验收标准
    type: required_sections
  - type: not_empty
  - chars: 200
    type: min_length
- id: arch_planner
  name: 架构规划师
  skill_name: autoplan
  prompt_key: arch_planner
  description: 技术方案设计、模块拆分、接口定义
  output_rules:
  - sections:
    - 技术选型
    - 架构设计
    - 模块划分
    - 接口定义
    - 风险与挑战
    type: required_sections
  - type: not_empty
  - chars: 300
    type: min_length
- id: code_generator
  name: 代码实现工程师
  skill_name: null
  prompt_key: code_generator
  description: 根据架构方案生成核心代码
  output_rules:
  - sections:
    - 实现思路
    - 核心代码
    - 单元测试
    - 注意事项
    type: required_sections
  - type: not_empty
  - chars: 300
    type: min_length
- id: qa_tester
  name: QA测试工程师
  skill_name: qa
  prompt_key: qa_tester
  description: 测试用例生成、边界验证、回归检查
  output_rules:
  - sections:
    - 测试策略
    - 测试用例
    - 边界条件
    - 回归建议
    type: required_sections
  - type: not_empty
  - chars: 200
    type: min_length
- id: security_auditor
  name: 安全审计工程师
  skill_name: cso
  prompt_key: security_auditor
  description: OWASP Top 10扫描、STRIDE威胁建模、合规检查
  output_rules:
  - sections:
    - 安全风险汇总
    - OWASP检查
    - 威胁建模
    - 修复建议
    - 合规状态
    type: required_sections
  - type: not_empty
  - chars: 300
    type: min_length
  skip_injection_check: true
- id: qa_tech_support
  name: 质量检查专家
  description: SDLC全链路输出质量综合评估
  prompt_key: sdlc_qa
  prompt_module: src.prompts_qa_domain