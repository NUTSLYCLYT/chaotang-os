# 刑部 · 合同红线清单(可评审 / 可回链 / 可覆盖)
#
# ★ 本版为【专家默认 v1】(status: expert_default) —— 由合同法经济(richard-posner)+ 安全边界
#   (bruce-schneier)视角出的、可辩护的行业默认值,门已上膛(能亮 red)。但每条红线都标
#   "专家默认·贵司法务可调",不冒充贵司法律终判。贵司法务复核后填自己的数、翻 status: confirmed,
#   即成本司作准红线;或随时改值覆盖。
#
# ⚠️ 非法律意见。默认值锚定 中国民法典 + 行业惯例,仅为可用起点,最终以贵司法务为准。
#
# 三档语义(xingbu_contract_vet):
#   placeholder   —— 纯占位,超阈值只 yellow 提醒,不亮 red(建门初期)
#   expert_default—— 专家默认,超阈值亮 red 但带"专家默认·法务可调"标注(本版)
#   confirmed     —— 贵司法务确认,超阈值亮 red 作准,无"待确认"标注
#
# 判定:合同文本抽违约金比例/账期天数,与 thresholds 比,超限 red/yellow 回链清单行;
#       命中 one_vote_red_clauses 任一 → 一票 red。

version: 2
status: expert_default   # placeholder / expert_default(本版) / confirmed

thresholds:
  # 违约金 > 合同额此比例 → red。锚点:民法典§585"违约金过分高于损失可请求调整",
  # 司法实务约以损失130%/合同额30%为界;超30%本司维权/被诉风险显著上升。
  违约金比例上限_pct: 30
  # 账期 > 此天数 → red(现金流红线)。锚点:《保障中小企业款项支付条例》倡导≤60天,
  # B2B 制造业常见30-90天;>90天现金流承压。
  账期上限_天: 90
  # 账期 > 此天数但未到上限 → yellow 预警。
  账期预警_天: 60
  # 质保 < 此年数 → yellow。锚点:储能系统/锂电产品行业质保常≥2年(电芯常更长)。
  质保期下限_年: 2

# 一票 red 条款:命中任一即 red(结构性风险,不靠数字)。任何商业律师都会拦的条款。
one_vote_red_clauses:
  - 无限责任
  - 无限连带
  - 连带责任保证       # 需评估:为他方债务背连带,风险外溢
  - 单方随时解除
  - 单方解除
  - 自动续约
  - 阴阳合同
  - 放弃抗辩权
  - 无条件回购
  - 知识产权全部归对方   # 本司研发成果被无偿转移
  - 最惠客户            # 价格/条款被绑定给对方,后续议价空间锁死

# 从合同文本定位数字的关键词锚点(vet 在这些词附近找百分比/天数/年数)
extract_anchors:
  违约金: [违约金, 滞纳金, 违约责任]
  账期: [账期, 付款期, 回款周期, 付款周期, 付款账期]
  质保: [质保期, 质保, 保修期, 质量保证期]
