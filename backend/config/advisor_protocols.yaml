version: "2026-06-07"
description: "朝堂蜂群大神调用协议：部门执行，大神参谋，三省/御史/harness 定输赢。"

global_contract:
  enabled: true
  principle: "大神不是证据，也不是放行人；大神只提供警示、天才建议、天才设计、失败路径和证据缺口。"
  required_outputs:
    - warning
    - genius_advice
    - failure_path
    - evidence_gap
    - confidence
  design_outputs:
    - genius_design
  forbidden:
    - "不得用大神意见替代 source/evidence"
    - "不得用大神背书绕过 harness"
    - "不得绕过报价、交期、安全、外发的人类签字"
    - "不得把 dry-run 当成真实 agent 能力证明"
  signoff_triggers:
    - "报价"
    - "交期承诺"
    - "安全/性能承诺"
    - "合同/法务承诺"
    - "外部系统写入"
    - "生产发布"
    - "客户外发"
    - "不可逆动作"
  levels:
    routine:
      advisors_required: 1
      output: "大神视角"
    substantial:
      advisors_required: 2
      output: "警示 + 天才建议"
    design:
      advisors_required: 3
      output: "警示 + 天才建议 + 天才设计 + 失败路径"
    irreversible:
      advisors_required: 4
      output: "小会审：共识 + 分歧 + 失败路径 + 最小行动 + 人工签字"

profiles:
  sales_aftercare:
    department: "兵部"
    advisors: ["aaron-ross", "neil-rackham", "chris-voss", "charity-majors"]
    use_for: "销售推进、客户异议、售后战情、客户反馈闭环"
  engineering:
    department: "工部"
    advisors: ["karpathy", "kent-beck", "martin-fowler", "charity-majors", "elon-musk-perspective", "sam-altman"]
    use_for: "架构、代码、测试、技术债、可观测性"
  finance:
    department: "户部"
    advisors: ["ben-graham", "drucker", "taleb-perspective", "deming", "dalio-perspective", "howard-marks-perspective", "duan-yongping"]
    use_for: "预算、ROI、报价假设、亏损风险"
  legal_risk:
    department: "刑部/御史"
    advisors: ["bruce-schneier", "richard-posner", "deming", "charity-majors", "contract-lawyer", "compliance-lawyer", "labor-lawyer", "ip-lawyer", "privacy-lawyer", "litigation-lawyer"]
    use_for: "安全、合规、权限、客户承诺、滥用风险;律师团(合同/合规/劳动/IP/隐私/诉讼)按真实法条接地供 verdict 风险+依据+改法"
  knowledge_archive:
    department: "史馆/翰林院"
    advisors: ["andrew-ng", "deming", "charity-majors", "karpathy", "jeff-bezos-perspective"]
    use_for: "golden cases、复盘、学习飞轮、知识沉淀"
  strategy_forecast:
    department: "钦天监/兵部"
    advisors: ["taleb-perspective", "kahneman", "jensen-huang", "peter-thiel", "munger-perspective", "soros-perspective", "mao"]
    use_for: "预测、战略、肥尾风险、情景推演"
  content_growth:
    department: "礼部"
    advisors: ["seth-godin", "zhang-xiaolong", "paula-scher", "zhang-yiming", "jobs", "naval"]
    use_for: "品牌表达、内容分发、用户注意力、信任"
  operations:
    department: "锦衣卫/太医院"
    advisors: ["charity-majors", "deming", "bruce-schneier", "harness-god"]
    use_for: "生产健康、观测、异常、provider/key、成本"
  governance:
    department: "三省/内阁"
    advisors: ["richard-posner", "bruce-schneier", "deming", "charity-majors", "wang-yangming", "andy-grove-perspective"]
    use_for: "起草、封驳、派发、审计、权限边界"

swarms:
  ai_ops:
    profile: operations
    level: design
    owner: "锦衣卫/太医院"
    genius_design: "每次运维判断必须留下 provider、model、run_id、gate_reason，失败样本直接进 golden candidate。"
  appointment:
    profile: governance
    level: irreversible
    owner: "吏部/三省"
    genius_design: "任命类输出只学系统改进，不学习老板对人的偏好。"
  battery_stage_gate:
    profile: legal_risk
    level: irreversible
    owner: "工部/刑部"
    genius_design: "每个 stage gate 必须有放行、弃权、返工三态；不可只给平均分。"
  brand_strategy:
    profile: content_growth
    level: design
    owner: "礼部"
    genius_design: "品牌手册必须是可执行规则(正例+反例),不是描述性文案;安全边界(防人格劫持)必须交合规审核司复核。"
  court:
    profile: governance
    level: design
    owner: "内阁/三省"
    genius_design: "三省只控制 transition，不直接替业务部门编造证据。"
  demo:
    profile: governance
    level: routine
    owner: "工部"
    genius_design: "demo 只能证明链路是否接通；每次输出必须标注非质量证明、缺少的 golden case、下一步正式验收命令。"
  demo_spawn:
    profile: engineering
    level: routine
    owner: "工部"
    genius_design: "spawn demo 必须显示调用了谁、为什么调用、输出是否进入下游。"
  demo_spawn_bailian:
    profile: engineering
    level: routine
    owner: "工部"
    genius_design: "第三方模型 demo 必须标注 provider 与降级路径。"
  evaluate:
    profile: knowledge_archive
    level: substantial
    owner: "翰林院/史馆"
    genius_design: "评估蜂群只评质量，不做销售线索、客户档案或 CRM。"
  finance:
    profile: finance
    level: irreversible
    owner: "户部"
    genius_design: "所有财务数字必须回链 verified_facts，缺来源即 hard_fail。"
  gongbu_review:
    profile: engineering
    level: substantial
    owner: "工部/御史"
    genius_design: "代码审查输出必须能变成任务卡：文件、风险、修复命令、验收命令。"
  haolong:
    profile: sales_aftercare
    level: substantial
    owner: "兵部/销售战情"
    genius_design: "线索不是进攻口号，必须先核客户身份、预算口径、交付窗口和禁止承诺。"
  hardware_design:
    profile: engineering
    level: design
    owner: "工部"
    genius_design: "硬件 DFM 结论必须逐一引用电芯/BMS/结构/热/连接器五路专业设计要点,不得笼统判可行。"
  ima:
    profile: knowledge_archive
    level: design
    owner: "史馆/翰林院"
    genius_design: "知识归档必须保留 source、outcome、适用边界和下次检索关键词。"
  kb_test:
    profile: knowledge_archive
    level: routine
    owner: "翰林院"
    genius_design: "知识库测试只证明检索链路，不证明业务结论。"
  legal:
    profile: legal_risk
    level: irreversible
    owner: "刑部"
    genius_design: "法律合规输出必须区分事实、法条、推断和需律师签字项。"
  jinyiwei:
    profile: knowledge_archive
    level: substantial
    owner: "锦衣卫"
    genius_design: "情报每条须标来源并分级(一手/二手/未证实);硬声明非一手必待人核;无可查证信息则明说,绝不编造。"
  tianjian:
    profile: strategy_forecast
    level: design
    owner: "钦天监"
    genius_design: "预测用概率性语言区分事实/假设/不确定,给多情景+驱动因素+可查证依据+风险提示;不可逆决策标人类签字点。"
  libu:
    # 2026-07-04 会审发现:这个key必须等于flow文件名去掉"flow_"前缀(scripts/validate_advisor_protocols.py
    # 强制校验),不能跟着swarm_orchestrator.yaml的routing id改名——flow文件本身还叫flow_libu.yaml,
    # 这里的"libu"指向吏部(owner字段),跟court_doc_builder等文件里"libu"=礼部是两个独立的命名空间,
    # 不是同一处冲突,不用一起改。
    profile: operations
    level: substantial
    owner: "吏部"
    genius_design: "招聘须给岗位画像+胜任力模型+可执行筛选标准+结构化面试题(STAR)与评分锚点+红线,结合锂电/储能行业资质,不给空结论。"
  lipu:
    profile: content_growth
    level: substantial
    owner: "礼部"
    genius_design: "对外稿只用真实素材,硬声明无素材支撑必标红;无绝对化夸大/贬损;输出即复制可发布版并标人工确认项。"
  medical:
    profile: operations
    level: substantial
    owner: "太医院"
    genius_design: "健康诊断必须有症状、检测信号、处置建议和复检时间。"
  opc:
    profile: sales_aftercare
    level: substantial
    owner: "兵部/销售战情"
    genius_design: "OPC 只负责方案边界和客户价值，不得越权承诺报价、交期和安全能力。"
  opc_multi_model_example:
    profile: engineering
    level: routine
    owner: "工部"
    genius_design: "多模型示例必须输出每个模型负责的步骤和冲突处理方式。"
  opc_no_knowledge:
    profile: sales_aftercare
    level: routine
    owner: "兵部/销售战情"
    genius_design: "无知识库版本必须显式标注证据缺口，不得伪装成完整方案。"
  pack_rd:
    profile: engineering
    level: design
    owner: "工部"
    genius_design: "PACK 方案每个技术数字必须绑定来源或试验假设，并给出证伪条件。"
  product:
    profile: engineering
    level: design
    owner: "工部"
    genius_design: "产品规划必须输出验收标准、依赖、风险和进入报价/研发的边界。"
  process_manufacturing:
    profile: engineering
    level: design
    owner: "工部"
    genius_design: "工艺 FMEA 的 RPN 必须能用 S×O×D 反推验证,三个分项评分缺一不可。"
  product_test:
    profile: engineering
    level: routine
    owner: "工部"
    genius_design: "产品测试 flow 只验证模板和断言，不替代 product 正式基线。"
  quotation:
    profile: finance
    level: irreversible
    owner: "户部/兵部"
    genius_design: "报价只能输出假设和需签字项；无依据数字、单点报价、交期承诺一律 blocked。"
  requirements:
    profile: governance
    level: substantial
    owner: "中书省/工部"
    genius_design: "需求拆解必须先定义用户、成功指标和最小可交付，再派发六部。"
  sdlc:
    profile: engineering
    level: design
    owner: "工部"
    genius_design: "SDLC 完成不等于可发布，必须过工部审查、测试和发布门禁。"
  shiguan_archive:
    profile: knowledge_archive
    level: substantial
    owner: "史馆"
    genius_design: "归档不是存文本，而是存能改进下一次路由的证据和 lesson。"
  sourcing:
    profile: strategy_forecast
    level: irreversible
    owner: "兵部/工部"
    genius_design: "供应商推荐必须给替代、弃权和反证条件，不能只给排序。"
  storage_aftercare:
    profile: sales_aftercare
    level: irreversible
    owner: "兵部/售后战情"
    genius_design: "售后分诊必须先保安全和客户沟通节奏；召回、安全、赔付承诺需刑部签字。"
  voice_sales:
    profile: sales_aftercare
    level: substantial
    owner: "兵部/销售战情"
    genius_design: "语音销售先提取身份、场景、预算和下一问，不直接推进报价。"
  xiaohongshu:
    profile: content_growth
    level: substantial
    owner: "礼部/兵部"
    genius_design: "内容增长必须绑定销售线索质量和客户反馈，不能只看发布量。"
