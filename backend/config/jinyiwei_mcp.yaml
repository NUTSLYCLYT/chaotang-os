servers:
  - server_id: westock
    display_name: 腾讯自选股
    endpoint_url: https://stockbuddy.qq.com/cgi/cgi-bin/openai/mcp/mcp
    transport: STREAMABLE_HTTP
    source_kind: PROFESSIONAL_DATA
    access_policy: SERVICE_AUTHENTICATED_FREE
    credential_ref: env://WESTOCK_MCP_CREDENTIAL
    enabled: true
    approval_version: 2026-07-23.real-2
    timeout_seconds: 10
    max_response_bytes: 1000000
    rate_limit_per_minute: 30
    allow_redirects: false
    cache_ttl_seconds: 30
    private_network_approved: false
    private_network_cidrs: []
    oauth_allowed_origins:
      - https://stockbuddy.qq.com

tools:
  - server_id: westock
    tool_name: data_search
    enabled: true
    resolver_only: true
    effect: READ_ONLY
    fact_categories:
      - ENTITY_REFERENCE
    data_scopes:
      - EXTERNAL_PUBLIC
    jurisdictions:
      - CN
      - HK
    approval_version: 2026-07-23.real-2
    approved_discovered_tool:
      name: data_search
      description: 股票/基金/板块搜索(名称、代码、拼音)。不确定 code 时第一步先调本工具。type=sector/index 时为清单名称子串匹配，请用简短关键词(如「算力」「CPO」)，勿传长句多词。
      inputSchema:
        type: object
        properties:
          jpkr_market:
            description: 日韩市场代码(如jp/kr)，非空时走日韩搜索
            type: string
          limit:
            default: 10
            description: 返回最大条数
            type: integer
          query:
            description: 搜索关键词，必填；sector/index 模式为板块/指数名称子串
            type: string
          type:
            description: "类型: stock/etf/bond/sector/index/futures/forex（默认 stock）"
            type: string
        required:
          - query
    approved_fingerprint: 90eb63a90bfa56461c4cd5034fc75bb00df4f845122aba072da46a29b7fa8e9e
    priority: 10

  - server_id: westock
    tool_name: data_minute
    enabled: true
    effect: READ_ONLY
    fact_categories:
      - MARKET_QUOTE
    market_metrics:
      - INTRADAY_SERIES
    data_scopes:
      - EXTERNAL_PUBLIC
    jurisdictions:
      - CN
    approval_version: 2026-07-23.real-2
    approved_discovered_tool:
      name: data_minute
      description: 分时数据
      inputSchema:
        properties:
          code:
            description: "股票代码，格式: sh600519/sz000001/hk00700，也兼容600519.SH等后缀格式，必填"
            type: string
          days:
            default: 1
            description: 天数
            type: integer
        required:
          - code
        type: object
    mapping:
      argument_paths: {}
      success_path: structuredContent.ok
      publisher_literal: 腾讯自选股
      source_url_literal: https://stockbuddy.qq.com/cgi/cgi-bin/openai/mcp/mcp
      unit_from_resolved_market: true
      subject_from_record_key: true
      record_by_subject_path: structuredContent.data
      metadata_paths: {}
      quality_ceiling: PRIMARY
      value_exclusive_min: 0
      publisher_allowlist:
        - 腾讯自选股
      unit_allowlist:
        - CNY
      source_url_origins:
        - https://stockbuddy.qq.com
      source_url_path_pattern: /cgi/cgi-bin/openai/mcp/mcp
      delimited_series:
        rows_path: data.data
        selection: LAST
        time_order: STRICT_ASCENDING
        delimiter: ASCII_SPACE
        exact_token_count: 4
        time_token_index: 0
        time_format: HHMM_24H
        date_path: data.date
        date_format: BASIC_ISO_DATE
        utc_offset: "+08:00"
        value_token_index: 1
        value_format: FINITE_DECIMAL
      entity_resolution:
        tool_name: data_search
        argument_paths:
          query: subject
        success_path: structuredContent.ok
        candidates_path: structuredContent.data
        candidate_subject_path: code
        candidate_name_path: name
        candidate_type_path: type
        required_types_by_market:
          CN:
            - GP-A
        target_argument: code
        subject_pattern: (?:sh|sz)[0-9]{6}
        subject_max_length: 8
        markets_by_jurisdiction:
          CN: CN
        units_by_market:
          CN: CNY
        jurisdiction_subject_patterns:
          CN: (?:sh|sz)[0-9]{6}
        exchange_subject_patterns:
          SSE: sh[0-9]{6}
          SZSE: sz[0-9]{6}
    approved_fingerprint: e067a2da8a86e642b367e2a2fc87f5e746df6eb6b2f20bb949613e8acc015ecf
    priority: 15

  - server_id: westock
    tool_name: data_quote
    enabled: true
    effect: READ_ONLY
    fact_categories:
      - MARKET_QUOTE
    market_metrics:
      - LAST_PRICE
    data_scopes:
      - EXTERNAL_PUBLIC
    jurisdictions:
      - CN
    approval_version: 2026-07-23.real-2
    approved_discovered_tool:
      name: data_quote
      description: 股票行情快照(最新价、涨跌幅等)。code 或 codes 至少填一个；不确定 code 时先 data_search
      inputSchema:
        type: object
        properties:
          code:
            description: 股票代码，如 sh600519(茅台)；与 codes 二选一
            type: string
          codes:
            description: 多只代码逗号分隔，如 sh600519,sz000001,hk00700
            type: string
          date:
            description: 可选历史日期 YYYY-MM-DD
            type: string
    mapping:
      argument_paths: {}
      success_path: structuredContent.ok
      value_path: price
      as_of_path: time
      as_of_date_utc_offset: "+08:00"
      publisher_literal: 腾讯自选股
      source_url_literal: https://stockbuddy.qq.com/cgi/cgi-bin/openai/mcp/mcp
      unit_from_resolved_market: true
      subject_path: code
      record_by_subject_path: structuredContent.data
      metadata_paths:
        instrument_id: code
        market_type: market_type
      quality_ceiling: PRIMARY
      value_exclusive_min: 0
      publisher_allowlist:
        - 腾讯自选股
      unit_allowlist:
        - CNY
      source_url_origins:
        - https://stockbuddy.qq.com
      source_url_path_pattern: /cgi/cgi-bin/openai/mcp/mcp
      entity_resolution:
        tool_name: data_search
        argument_paths:
          query: subject
        success_path: structuredContent.ok
        candidates_path: structuredContent.data
        candidate_subject_path: code
        candidate_name_path: name
        candidate_type_path: type
        required_types_by_market:
          CN:
            - GP-A
        target_argument: code
        subject_pattern: (?:sh|sz)[0-9]{6}
        subject_max_length: 8
        markets_by_jurisdiction:
          CN: CN
        units_by_market:
          CN: CNY
        jurisdiction_subject_patterns:
          CN: (?:sh|sz)[0-9]{6}
        exchange_subject_patterns:
          SSE: sh[0-9]{6}
          SZSE: sz[0-9]{6}
    approved_fingerprint: 76faa8fc8aa84b1764e4fc4b655bea792114cebf476699d01d3abd4178cd1630
    priority: 20
