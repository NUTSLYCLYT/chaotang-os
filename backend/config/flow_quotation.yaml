flow_name: 报价单生成流程
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
# 接通 5 年真实购销合同(chroma 本地检索)→ 报价基于历史成交价,不再拍脑袋
knowledge_pre_retrieval:
  enabled: true
  top_k: 4
  max_tokens: 2000
steps:
- id: quotation_analyst
  name: 报价分析师
  description: 需求解构与报价框架
  prompt_key: quotation_analyst
  prompt_module: src.prompts_quotation
  knowledge_scope:
  - 购销合同
  - code_review_rules
- id: cost_engineer
  name: 成本核算师
  description: BOM级成本拆解与毛利校验
  prompt_key: cost_engineer
  prompt_module: src.prompts_quotation
  knowledge_scope:
  - 购销合同
  - code_review_rules
- id: commercial_manager
  name: 商务经理
  description: 报价策略与合同条款
  prompt_key: commercial_manager
  prompt_module: src.prompts_quotation
- id: tech_solution
  name: 技术方案工程师
  description: 技术规格书与综合报价单输出
  prompt_key: tech_solution
  prompt_module: src.prompts_quotation
- id: conflict_resolver
  name: 冲突仲裁专家
  description: 数值对账表 + 文本冲突检测，输出统一立场
  prompt_key: quotation_conflict
  prompt_module: src.prompts_quotation
  output_rules:
  - type: min_length
    chars: 400
  - type: not_empty
- id: qa_tech_support
  name: 质量检查专家
  description: QA质量检查与综合输出
  prompt_key: quotation_qa
  prompt_module: src.prompts_quotation
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 项目概要
- 系统配置
- 技术参数表
- 报价明细
- 合同条款
- 风险与建议
