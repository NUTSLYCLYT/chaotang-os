# jiqun_ai 总注册表。
# 这份文件描述系统制度，不替代 flow YAML；flow YAML 仍是每个蜂群的运行配置。
system:
  id: jiqun_ai
  name: 集群 AI 组织操作系统
  definition: 三省六部治理任务，蜂群执行业务，庄园补充专家，大神提升判断，红蓝对抗保证质量，IMA 沉淀知识。
  court_entry: config/flow_court.yaml
  swarm_orchestrator: config/swarm_orchestrator.yaml
  manor_groups: config/manor_groups.yaml
  review_committee: config/review_committee.yaml
  global_tail_flow: config/global_tail_flow.yaml

terms:
  flow: 工作流配置，一个可运行流程。
  swarm: 业务蜂群，由一个 flow 和多个子 agent 组成。
  agent: flow 里的执行角色，通常对应 runtime_prompts/<prompt_key>/。
  manor: 专家庄园/能力池，可用 subagent 或 OpenClaw 运行。
  court: 三省六部治理层，负责理解、审议、派发、复核。
  persona: 大神视角，用于评审，不替代执行 agent。
  critic: 红蓝对抗/质疑角色，负责找失败路径。

runtime_policy:
  default: subagent
  subagent:
    use_for:
      - workflow_steps
      - qa
      - critic
      - persona_review
      - low_latency_business_tasks
    reason: 轻、快、便宜、可观测，适合作为 14 个蜂群的主流程骨架。
  openclaw:
    use_for:
      - long_running_manors
      - external_tool_execution
      - cross_task_memory
      - independent_department_agents
    fallback: subagent
    reason: 更适合长期、有工具、有记忆、有独立行动能力的庄园。

layers:
  - id: court
    name: 三省六部治理层
    config: config/flow_court.yaml
    responsibility: 总入口、审议、派单、复核和回传。
  - id: swarms
    name: 蜂群执行层
    config: config/swarm_orchestrator.yaml
    responsibility: 14 个业务蜂群按事件和质量门控联动。
  - id: manors
    name: 庄园专家层
    config: config/manor_groups.yaml
    responsibility: 横向专家能力池，默认 subagent，可升级 OpenClaw。
  - id: critics
    name: 红蓝对抗层
    config: config/global_tail_flow.yaml
    responsibility: 质疑、找漏洞、找失败路径。
  - id: personas
    name: 大神评审层
    config: config/review_committee.yaml
    responsibility: 战略、风险、产品、工程和商业本质评审。
  - id: memory
    name: 知识沉淀层
    config: config/flow_ima.yaml
    responsibility: 归档高质量结果、争论过程和复盘经验。

swarm_categories:
  core_business:
    name: 核心业务链
    order:
      - haolong
      - opc
      - product
      - quotation
  rnd_delivery:
    name: 研发交付链
    order:
      - sourcing
      - pack_rd
      - hardware_design
      - process_manufacturing
      - battery_stage_gate
  functional_support:
    name: 职能支撑链
    order:
      - finance
      - legal
      - brand_strategy
      - xiaohongshu
      - ima
  governance_ops:
    name: 治理运维链
    order:
      - court
      - ai_ops
  tools:
    name: 工具型蜂群
    order:
      - sdlc

swarms:
  - id: haolong
    name: 郝龙获客 Pipeline
    category: core_business
    config: config/flow_haolong.yaml
    runtime: subagent
    agents: [lead_acquisition, lead_archive, lead_outreach, content_publish, qa_tech_support]
    tail_policy: standard

  - id: opc
