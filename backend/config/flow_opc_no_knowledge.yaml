# TEST-ONLY(2026-07-04标注):无知识注入版本,用于 scripts/knowledge_ab_test.py 的AB测试对比
# (vs flow_opc.yaml),非独立业务能力,未注册进 swarm_orchestrator.yaml。计"33个flow"时不算
# 业务蜂群,见 docs/chaotang_workflow_swarm_upgrade_2026-06-07.md
flow_name: "OPC市场方案流程(无知识注入)"

# QA版本配置：v1 (旧版) 或 v2 (6维度评分版)
# v1: 基础质量检查，输出 pass/fail + issues
# v2: 6维度质量评分，输出评分 + 改进建议
qa_version: "v3"

# 默认模型配置（如果 step 未指定 model，则使用此配置）
default_model: "openai/swarm-worker"
default_api_base: "http://127.0.0.1:4444/v1"
default_api_key_env: "LITELLM_PROXY_KEY"


# 模型调用失败自动重试：最多2次，首次等3秒，指数退避
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
    - error

steps:
  - id: "opc_leader"
    name: "OPC负责人"
    description: "任务分解与目标定义"
    prompt_key: "opc_leader"
    # model: "gpt-4o"  # 可选：指定此 step 使用的模型（不指定则使用 default_model）

  - id: "market_intel"
    name: "市场情报专家"
    description: "市场与竞品情报分析"
    prompt_key: "market_intel"
    # model: "claude-3-5-sonnet-20241022"  # 示例：使用 Claude

  - id: "solution_architect"
    name: "解决方案架构师"
    description: "技术方案设计"
    prompt_key: "solution_architect"

  - id: "customer_success"
    name: "客户成功经理"
    description: "客户价值表达转化"
    prompt_key: "customer_success"

  - id: "qa_tech_support"
    name: "技术支持专家"
    description: "QA质量检查与综合输出"
    prompt_key: "qa_tech_support"
    tools:
      - server: "email"
        capabilities: ["prepare_email_draft"]

# 自动修复循环配置
repair:
  enabled: false            # 设为 true 启用 QA 驱动的自动修复
  max_retries: 3            # 最大修复轮次
  min_score: 3.5            # 目标总分（达标即停止）
  min_delta: 0.2            # 每轮最小改善幅度（低于则视为无改善）
  min_dimension_score: 3.0  # 单维度最低分（任一低于则触发修复）

output_fields:
  - "客户背景"
  - "核心需求"
  - "市场分析"
  - "竞品情况"
  - "解决方案"
  - "客户价值"
  - "风险与建议"
