flow_name: 电芯Sourcing搜寻流程
max_llm_calls: 60
knowledge_pre_retrieval:
  enabled: false
  top_k: 3
  max_tokens: 1500
  dataset_ids: ${RAGFLOW_DS_INDUSTRY},${RAGFLOW_DS_PRODUCT}
knowledge_inject:
  file: "config/eval/cell_library.json"  # 电芯真值库单一来源(实测197芯)
  max_tokens: 4000
qa_version: v3
default_model: openai/glm-5.1
default_api_base: http://127.0.0.1:4000/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: sourcing_dispatcher
  name: 搜寻调度官
  description: 需求拆解与搜寻任务下发
  prompt_key: sourcing_dispatcher
  prompt_module: src.prompts_sourcing
- id: supplier_intel
  name: 供应商情报员
  description: 供应商商务/技术/财务/法律基础信息收集
  prompt_key: supplier_intel
  prompt_module: src.prompts_sourcing
- id: cell_spec_collector
  name: 电芯参数采集员
  description: 电芯详细技术规格采集（含来源标注）
  prompt_key: cell_spec_collector
  prompt_module: src.prompts_sourcing
- id: spec_normalizer
  name: 数据清洗师
  description: 实测/规格/宣传/估算 四类分离与基准统一
  prompt_key: spec_normalizer
  prompt_module: src.prompts_sourcing
- id: virtual_inquirer
  name: 虚拟询价员
  description: 100/1k/10k 三档虚拟询价与响应能力评估
  prompt_key: virtual_inquirer
  prompt_module: src.prompts_sourcing
- id: sourcing_synthesizer
  name: 整合分析师
  description: 综合分析与 S/A/B/C 推荐等级
  prompt_key: sourcing_synthesizer
  prompt_module: src.prompts_sourcing
- id: qa_tech_support
  name: 质量检查专家
  description: QA质量检查与综合输出
  prompt_key: sourcing_qa
  prompt_module: src.prompts_sourcing
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 搜寻任务清单
- 供应商情报矩阵
- 电芯参数对比表
- 数据置信度评估
- 询价响应评估
- 推荐供应商池
- 风险与替代方案
