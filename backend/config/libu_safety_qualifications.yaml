# 吏部 · 锂电/储能岗位安全资质红线清单(可评审 / 可回链)
#
# 用途:吏部 libu_vet 据此判"招聘方案漏安全资质红线"。取代此前硬编码的 8 个关键词——
# 现在红线可回链到具体清单行(role + required_any + reason + 清单版本),可证伪、可评审,
# 不是"我说了算"。deming 会审建议落地:红线接真清单,像户部数字回链一样有据。
#
# 判定口径(libu_vet._battery_safety_items):
#   1. task_input 命中 roles[].match 任一 → 该行 required_any 成为硬红线;
#   2. 招聘方案文本须出现该行 required_any 任一,否则判 red(漏红线),并指名"缺哪类资质+为什么";
#   3. 命中电池域但无具体 role 命中 → 走 default_required_any 兜底(泛安全资质表述即可)。
#
# 维护:新增岗位类别在 roles 追加一行即可;改动请升 version,配套跑 test_libu_vet.py。

version: 1

# 电池/储能领域触发词(命中才启用安全资质红线;非电池岗不强制)。
domain_keywords: [锂电, 电池, 储能, PACK, 电芯, pack, BMS, 电化学]

roles:
  - id: R-PACK
    match: [PACK, pack, 焊接, 化成, 分容, 组装, 产线, 工艺]
    required_any: [特种作业, 焊工证, 危化, EHS, 安全操作]
    reason: 电芯/PACK 产线涉焊接与化成,属特种作业 + 危化环境,须持证上岗

  - id: R-STORAGE-OPS
    match: [储能, 电站, 运维, 现场, 巡检, 售后]
    required_any: [电工进网, 特种作业, 高压电工, 消防, EHS]
    reason: 储能电站运维涉高压带电作业与消防,须相应特种作业/电工资质

  - id: R-CELL-RD
    match: [电芯, BMS, 电化学, 研发, 材料, 实验]
    required_any: [危化, 实验室安全, MSDS, 化学品]
    reason: 电芯/材料研发涉危化品与实验室安全,须危化品与实验室安全资质

# 命中电池域但未命中任何具体 role 时的兜底:出现泛安全资质表述即可(不强制到证种)。
default_required_any: [安全, 资质, 合规, 认证, 持证, 危化, 消防, 特种作业]
