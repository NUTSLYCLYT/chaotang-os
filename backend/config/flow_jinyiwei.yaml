flow_name: 锦衣卫情报蜂群
qa_domain: general  # 非产品蜂群:豁免 C2需求约束/C3规格实测 产品语义硬核查,只强制 C1 数字勾稽
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: jinyiwei_collect
  name: 情报采集卫
  description: 按目标采集情报,每条带来源/时间/类别,反捏造
  prompt_key: jinyiwei_collect
  prompt_module: src.prompts_jinyiwei
- id: jinyiwei_vet
  name: 可信度核查卫
  description: 入库前可信度分级+跨源印证+硬声明拦截
  prompt_key: jinyiwei_vet
  prompt_module: src.prompts_jinyiwei
- id: jinyiwei_synthesize
  name: 情报整理卫
  description: 时间线+分类+相关性评级+截止时间,出决策就绪战情
  prompt_key: jinyiwei_synthesize
  prompt_module: src.prompts_jinyiwei
- id: qa_tech_support
  name: 质量检查专家
  description: QA核查:来源齐全/无捏造/分级完整
  prompt_key: qa_tech_support
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 情报来源清单(含URL/出处)
- 可信度核查结论
- 时间线情报整理
- 竞品对比要素
- 相关性评级
- 信息截止时间与局限说明

knowledge_pre_retrieval:
  enabled: true
  top_k: 5
  max_tokens: 2000
