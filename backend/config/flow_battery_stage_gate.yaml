default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_model: openai/swarm-worker
default_retry:
  backoff: 2
  delay: 3
  max_retries: 2
  retry_on:
  - error
flow_name: 电池研发 Stage Gate 决策蜂群
ima_pre_retrieval:
  enabled: true
  knowledge_base_id: LQwD0jsCJ6DQQHd06ahTFxsNg_q0oBQ83fJDrSms7MU=
  queries:
  - '{task_input}'
  - Stage Gate 评审标准
  - 电池失效模式分析
  - 低温电池制造工艺
  top_k: 5
output_fields:
- 项目现状评估
- 架构评审结论
- 制造可行性结论
- 失效风险分析
- Stage Gate 决策
- 后续行动计划
- 风险与建议
qa_version: v3
repair:
  enabled: true
  max_retries: 1
  min_delta: 0.2
  min_dimension_score: 3
  min_score: 3.0
steps:
- description: 接收 PACK 研发方案，汇总项目现状、关键指标与里程碑完成情况，为后续专项评审准备结构化背景
  id: battery_project_reviewer
  name: 电池项目评审协调员
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 项目现状摘要
    - 关键技术指标现状
    - 里程碑完成情况
    - 评审重点清单
    type: required_sections
  prompt_key: battery_project_reviewer
- depends_on:
  - battery_project_reviewer
  description: 对电池格式选型、串并方案、Tab 策略进行专项评审，输出架构评审结论（通过/有条件通过/否决）及接口约束清单
  id: architecture_reviewer
  name: 电池架构评审专家
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 架构方案评审摘要
    - 关键架构决策分析
    - 架构接口约束清单
    - 架构评审结论
    type: required_sections
  prompt_key: architecture_reviewer
- depends_on:
  - architecture_reviewer
  description: 评审制造工艺可行性、良率预测、关键工艺瓶颈；与失效分析并行执行，共同依赖架构评审结论
  id: manufacturing_reviewer
  name: 制造可行性评审专家
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 制造工艺评审摘要
    - 良率分析
    - 关键工艺瓶颈与控制方案
    - 制造评审结论
    type: required_sections
  prompt_key: manufacturing_reviewer
- depends_on:
  - architecture_reviewer
  description: 前置识别失效风险，进行 FMEA 分析（含 RPN 评分）；与制造评审并行执行，共同依赖架构评审结论
  id: failure_analyst
  name: 失效分析专家
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 失效模式清单
    - 高优先级失效模式根本原因分析
    - 改进方案优先级清单
    - 失效分析摘要结论
    type: required_sections
  prompt_key: failure_analyst
- depends_on:
  - manufacturing_reviewer
  - failure_analyst
  description: 汇聚架构评审、制造评审、失效分析三路结论，给出 go/hold/no-go 最终 Gate 决策
  id: stage_gate_reviewer
  name: Stage Gate 决策官
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections:
    - Stage Gate 决策
    - 决策依据
    - 关键风险清单
    - 后续行动计划
    - 评审记录摘要
    type: required_sections
  prompt_key: stage_gate_reviewer
- depends_on:
  - stage_gate_reviewer
  description: QA 质量评审，对整个决策链路的完整性、逻辑一致性和可执行性进行评分
  id: qa_tech_support
  name: 技术支持专家（QA）
  prompt_key: battery_stage_gate_qa
  prompt_module: src.prompts_qa_domain
layout_override:
  battery_project_reviewer:
    x: 250
    y: 0
  architecture_reviewer:
    x: 250
    y: 260
  failure_analyst:
    x: 0
    y: 520
  manufacturing_reviewer:
    x: 500
    y: 520
  stage_gate_reviewer:
    x: 250
    y: 780
  qa_tech_support:
    x: 250
    y: 1040
