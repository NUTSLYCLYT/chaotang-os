# 工具+知识库组合预设
#
# Flow YAML 中可在 step 上引用：
#   steps:
#     - id: market_scan
#       preset: market_research          # 一键展开
#       tools:                           # 可叠加（去重）
#         - server: web_search
#           capabilities: [fetch_url]
#
# 加载逻辑：src/preset_loader.py:apply_preset()
#   1. 读取 preset 名 → 展开 tools + knowledge
#   2. step 自带的 tools / knowledge 与 preset 合并去重
#   3. step 配置优先级高于 preset

presets:

  # ── 市场研究：互联网搜索 + 行业知识库 + IMA 公众号 ──
  market_research:
    description: 市场情报分析（外网+行业RAG+公众号）
    tools:
      - server: web_search
        capabilities: [web_search, fetch_url]
    knowledge:
      - source: ragflow
        dataset: ${RAGFLOW_DS_INDUSTRY}
        top_k: 5
      - source: ima
        dataset: ${IMA_KB_INDUSTRY}
        top_k: 3

  # ── 销售咨询：CRM + 历史案例 + 邮件草稿 ──
  sales_consultation:
    description: 客户成功 / 销售触达
    tools:
      - server: crm
        capabilities: [search_customers, get_customer_detail, create_lead]
      - server: email
        capabilities: [prepare_email_draft]
    knowledge:
      - source: chroma
        dataset: case_archive
        top_k: 3

  # ── 电池技术研究：行业RAG + IMA技术资料 ──
  battery_rd:
    description: 电池研发技术调研
    tools:
      - server: web_search
        capabilities: [web_search]
      - server: knowledge_rag
        capabilities: [search_docs]
    knowledge:
      - source: ragflow
        dataset: ${RAGFLOW_DS_BATTERY}
        top_k: 5
      - source: chroma
        dataset: default
        top_k: 3

  # ── 内容运营：小红书 + 内部知识库 ──
  content_ops:
    description: 小红书等社媒内容创作
    tools:
      - server: xiaohongshu
        capabilities: [search_notes, search_competitors]
    knowledge:
      - source: ragflow
        dataset: ${RAGFLOW_DS_CONTENT}
        top_k: 3

  # ── 量化交易：行情数据 + 基本面 + 回测 ──
