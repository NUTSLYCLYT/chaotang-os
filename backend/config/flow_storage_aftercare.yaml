default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_model: openai/swarm-worker
default_retry:
  backoff: 2
  delay: 3
  max_retries: 2
  retry_on:
  - error
flow_name: 储能电站售后故障诊断蜂群
max_llm_calls: 60
knowledge_inject:
  file: knowledge/battery_prices.yaml
  max_tokens: 1500
knowledge_pre_retrieval:
  enabled: true
  top_k: 4
  max_tokens: 2000
output_fields:
- 故障分诊
- 现场数据快照
- BMS诊断结论
- 根因与失效模式
- 处置工单
- 备件与工时
- 客户沟通话术
- 风险与升级建议
qa_version: v3
repair:
  enabled: true
  max_retries: 1
  min_delta: 0.2
  min_dimension_score: 3
  min_score: 3.5
steps:
- description: 接收告警/客户描述，输出紧急度分级与初步分诊
  few_shot_from_cases: true
  few_shot_top_k: 2
  id: fault_triager
  lint_max_retries: 2
  name: 故障分诊员
  prompt_module: src.prompts_aftercare
  knowledge_scope:
  - battery_tech
  output_rules:
  - sections:
    - 告警摘要
    - 现场背景
    - 紧急度评级
    - 初步分诊
    - 待采集数据清单
    type: required_sections
  - type: forbidden_patterns
    patterns:
    - pattern: "高概率|大概率|倾向|基本符合|可能不是缺陷|正常特性"
      description: "规格书未到手前不得给责任归属倾向"
    - pattern: "(LFP|NCM)[-_ ]?\\d{2,3}C[-_ ]?\\d+|BMS固件(?:版本)?[:：]?\\s*[A-Za-z0-9._-]+"
      description: "不得虚构具体电芯型号或BMS固件版本"
  - chars: 300
    type: min_length
  - type: not_empty
  - type: no_refusal
  prompt_key: fault_triager
- depends_on:
  - fault_triager
  description: 按分诊清单拉取云平台运行数据、历史告警、客户工单历史
  id: telemetry_collector
  name: 数据采集员
  prompt_module: src.prompts_aftercare
  output_rules:
  - type: not_empty
  - chars: 200
    type: min_length
  - type: number_consistency
  - sections:
    - 运行数据快照
    - 历史告警时间线
    - 客户工单历史
    - 数据完整度评估
    type: required_sections
  prompt_key: telemetry_collector
  tools:
  - capabilities:
    - query_telemetry
    - query_alarm_history
    server: storage_platform
- depends_on:
  - telemetry_collector
  description: 基于运行数据做 SOC/SOH/单体压差/温升曲线分析
  id: bms_diagnostician
  name: BMS诊断师
  prompt_module: src.prompts_aftercare
  knowledge_scope:
  - battery_tech
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: number_consistency
  - type: forbidden_patterns
    patterns:
    - pattern: "高概率|大概率|倾向|基本符合|可能不是缺陷|正常特性"
      description: "规格书未到手前不得给责任归属倾向"
    - pattern: "(LFP|NCM)[-_ ]?\\d{2,3}C[-_ ]?\\d+|BMS固件(?:版本)?[:：]?\\s*[A-Za-z0-9._-]+"
      description: "不得虚构具体电芯型号或BMS固件版本"
  - sections:
    - 电气指标分析
    - 热分布分析
    - 异常单体定位
    - BMS诊断结论
    type: required_sections
  prompt_key: bms_diagnostician
- depends_on:
  - telemetry_collector
  description: 根据现场数据做失效模式识别+RCA，与 BMS 诊断并行
  id: field_failure_analyst
  name: 现场失效分析师
  prompt_module: src.prompts_aftercare
  knowledge_scope:
  - battery_tech
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - type: forbidden_patterns
    patterns:
    - pattern: "高概率|大概率|倾向|基本符合|可能不是缺陷|正常特性"
      description: "规格书未到手前不得给责任归属倾向"
    - pattern: "(LFP|NCM)[-_ ]?\\d{2,3}C[-_ ]?\\d+|BMS固件(?:版本)?[:：]?\\s*[A-Za-z0-9._-]+"
      description: "不得虚构具体电芯型号或BMS固件版本"
  - sections:
    - 失效模式判定
    - 根本原因分析
    - 设计/工艺/操作归因
    - 改进与防扩散建议
    type: required_sections
  prompt_key: field_failure_analyst
- depends_on:
  - bms_diagnostician
  - field_failure_analyst
  description: 汇总诊断+RCA，生成现场处置工单、备件清单、客户沟通话术
  id: workorder_generator
  name: 处置工单生成器
  prompt_module: src.prompts_aftercare
  assertions:
    # customer_invariant·高风险承诺护栏:客户话术/升级建议里出现赔付/责任承诺时,
    # 无质保授权源(ctx.warranty_facts)就必须挂"需人工签字"门,否则 fail-secure 拦下。
    # 这是单向门(向客户承诺赔付不可逆),空源绝不放行。
    post:
    - type: high_stakes_claim_guard
      authorizing_key: warranty_facts
      signoff_marker: 需人工签字
      on_fail: hard_fail
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: forbidden_patterns
    patterns:
    - pattern: "高概率|大概率|倾向|基本符合|可能不是缺陷|正常特性"
      description: "规格书未到手前不得给责任归属倾向"
    - pattern: "(LFP|NCM)[-_ ]?\\d{2,3}C[-_ ]?\\d+|BMS固件(?:版本)?[:：]?\\s*[A-Za-z0-9._-]+"
      description: "不得虚构具体电芯型号或BMS固件版本"
  - sections:
    - 处置工单
    - 备件清单
    - 工时与人员配置
    - 客户沟通话术
    - 升级与召回建议
    type: required_sections
  prompt_key: workorder_generator
  tools:
  - capabilities:
    - prepare_email_draft
    - create_workorder_draft
    server: workorder_system
- depends_on:
  - workorder_generator
  description: QA 六维度评分 + 触发 repair（如有质量风险）
  id: qa_tech_support
  name: 技术支持专家(QA)
  prompt_key: qa_tech_support
  assertions:
    # 末步兜底:最终汇总输出同样过高风险承诺护栏,确保赔付承诺要么有质保授权、要么挂签字门。
    post:
    - type: high_stakes_claim_guard
      authorizing_key: warranty_facts
      signoff_marker: 需人工签字
      on_fail: hard_fail
layout_override:
  fault_triager:
    x: 250
    y: 0
  telemetry_collector:
    x: 250
    y: 260
  bms_diagnostician:
    x: 0
    y: 520
  field_failure_analyst:
    x: 500
    y: 520
  workorder_generator:
    x: 250
    y: 780
  qa_tech_support:
    x: 250
    y: 1040
