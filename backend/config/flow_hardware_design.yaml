flow_name: 工部硬件设计蜂群流程
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3
  backoff: 2
  retry_on:
  - error
max_llm_calls: 100
knowledge_pre_retrieval:
  enabled: true
  top_k: 4
  max_tokens: 2000
knowledge_inject:
  file: "config/eval/cell_library.json"  # 电芯真值库单一来源(实测197芯),与 pack_rd 共用
  max_tokens: 4000
qa_version: v3
repair:
  enabled: true
  critic_before_repair: true
  max_retries: 1
  min_score: 3.5
output_fields:
- 候选方案对比表
- 保护电路架构
- 连接器与线束方案
- 结构设计方案
- 热设计方案
- DFM评审结论
- 硬件BOM汇总
steps:
- id: cell_selection_deep
  name: 电芯选型深化工程师
  prompt_key: cell_selection_deep
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["候选方案对比表", "寿命预测", "可制造性初判", "最终推荐"]
    type: required_sections
- id: bms_hardware_designer
  name: BMS硬件设计工程师
  depends_on: [cell_selection_deep]
  prompt_key: bms_hardware_designer
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["保护电路架构", "EMC与安规考量", "采样精度与均衡策略", "硬件接口清单"]
    type: required_sections
- id: thermal_engineer
  name: 热设计工程师
  depends_on: [cell_selection_deep]
  prompt_key: thermal_engineer
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections: ["热设计方案", "低温性能保障", "热仿真建议", "热管理风险"]
    type: required_sections
- id: mechanical_structure_engineer
  name: 结构工程师
  depends_on: [cell_selection_deep, thermal_engineer]
  prompt_key: mechanical_structure_engineer
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections: ["结构设计方案", "强度与振动校核", "防护等级设计", "装配可行性"]
    type: required_sections
- id: connector_harness_engineer
  name: 连接器与线束设计工程师
  depends_on: [bms_hardware_designer, mechanical_structure_engineer]
  prompt_key: connector_harness_engineer
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections: ["连接器选型", "线束方案", "安全与防护设计", "装配可行性初判"]
    type: required_sections
- id: hardware_dfm_reviewer
  name: 硬件可制造性评审专家
  depends_on: [mechanical_structure_engineer, connector_harness_engineer]
  prompt_key: hardware_dfm_reviewer
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["DFM评审总览", "装配公差链分析", "关键制造风险清单", "DFM综合结论"]
    type: required_sections
- id: hardware_bom_compiler
  name: 硬件BOM汇总专家
  depends_on: [cell_selection_deep, bms_hardware_designer, mechanical_structure_engineer, connector_harness_engineer, thermal_engineer]
  prompt_key: hardware_bom_compiler
  prompt_module: src.prompts_hardware_design
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections: ["完整硬件BOM", "硬件成本汇总", "待确认项清单"]
    type: required_sections
- id: qa_tech_support
  name: 技术支持专家(QA)
  depends_on: [hardware_dfm_reviewer, hardware_bom_compiler]
  prompt_key: hardware_design_qa
  prompt_module: src.prompts_hardware_design
