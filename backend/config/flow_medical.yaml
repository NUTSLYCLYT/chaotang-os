# 平台能力DEMO(2026-07-04标注):医院垂直,与电池/储能主业无关,留作平台通用性证明,
# 见 docs/chaotang_workflow_swarm_upgrade_2026-06-07.md
flow_name: 医院智能导诊咨询
default_model: openai/swarm-worker
default_api_key_env: LITELLM_PROXY_KEY
default_api_base: http://127.0.0.1:4444/v1
qa_version: v3
repair:
  enabled: false
  max_retries: 2
  min_score: 3.5
output_fields:
- 患者主诉
- 建议科室
- 就诊建议
- 注意事项
- 紧急程度
steps:
- id: medical_analyst
  name: 导诊顾问
  prompt_key: medical_analyst
  description: 收集患者症状和就医需求，输出导诊建议记录，包含建议科室、就诊提示和注意事项。
  output_rules:
  - sections:
    - 患者主诉
    - 建议科室
    - 就诊建议
    - 注意事项
    - 紧急程度
    type: required_sections
  - type: not_empty
  - chars: 100
    type: min_length
