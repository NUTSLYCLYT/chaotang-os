flow_name: "工部代码审查蜂群"
max_llm_calls: 40

# 由 new_swarm.py 生成的骨架。提示词在 src/prompts_gongbu_review.py 精修。
knowledge_pre_retrieval:
  enabled: false

qa_version: "v3"

default_model: "openai/swarm-worker"
default_api_base: "http://127.0.0.1:4444/v1"
default_api_key_env: "LITELLM_PROXY_KEY"

default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
    - error

steps:
  # 第一层：代码质量分析（提供基础上下文）
  - id: "code_analyst"
    name: "代码质量分析师"
    description: "审查代码质量/架构/可维护性，输出含原始代码行号的证据"
    prompt_key: "code_analyst"
    prompt_module: "src.prompts_gongbu_review"
    # 代码审查蜂群:各步合法处理含"绕过/ignore/安全"措辞的代码与审查文本,注入检测会误报(2026-06-22 gongbu eval 实证)。
    # 跳过注入检测,同 sdlc security_auditor 范本;上下文压缩与 post_check 不受影响。
    skip_injection_check: true

  # 第二层：安全 + 功能 并行审查（独立读原始代码，不依赖对方输出）
  - id: "security_inspector"
    name: "安全审查官"
    description: "OWASP+低温电池场景特有安全风险（RAG幻觉/tenant隔离/熔断完整性）"
    prompt_key: "security_inspector"
    prompt_module: "src.prompts_gongbu_review"
    skip_injection_check: true  # 安全审查必然讨论"绕过/注入",跳过注入误报(同 sdlc security_auditor)
    depends_on:
      - code_analyst

  - id: "func_verifier"
    name: "功能验证师"
    description: "核查实现是否符合蜂群系统功能契约（与安全审查并行）"
    prompt_key: "func_verifier"
    prompt_module: "src.prompts_gongbu_review"
    skip_injection_check: true  # 消费原始代码,可能含注入样的字符串,跳过误报
    depends_on:
      - code_analyst

  # 第三层：汇总（收三份一手报告再判定）
  - id: "review_synthesizer"
    name: "审查汇总官"
    description: "汇总三份独立审查给出PASS/BLOCK + must_not条目（含哈希id）"
    prompt_key: "review_synthesizer"
    prompt_module: "src.prompts_gongbu_review"
    skip_injection_check: true  # 汇总三份审查,累积最多安全措辞,最易误报
    depends_on:
      - security_inspector
      - func_verifier
    assertions:
      # 机判 verdict 闸:强制审查门吐出明确 PASS/BLOCK 判定,杜绝"裸奔门"含糊放行。
      # 守所有代码的门,自己先被机判尺子量(纯YAML复用 contains_any,零Python)。
      post:
        - type: contains_any
          values: ["BLOCK", "PASS"]
          on_fail: hard_fail

  - id: "qa_tech_support"
    name: "质量检查专家"
    description: "QA 质量检查与综合输出"
    prompt_key: "qa_tech_support"
    skip_injection_check: true  # 实证拦点:其输入=审查汇总,含"绕过安全"被误判注入(2026-06-22)
    depends_on:
      - review_synthesizer

repair:
  enabled: false
  max_retries: 3
  min_score: 3.5
  min_delta: 0.2
  min_dimension_score: 3.0

output_fields:
  - "代码质量报告"
  - "安全风险清单"
  - "功能符合性报告"
  - "审查总结论(PASS/BLOCK)"
  - "must_not条目建议"
