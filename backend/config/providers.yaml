active: deepseek
providers:
  ollama_local:
    name: 本地 Ollama（零外部key·离线·去脆弱·大神会审5:0定为唯一出口）
    api_base: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    # 2026-06-23 修:旧模型名 qwen2.5:14b/gpt-oss:20b 在本机 ollama 里不存在,
    # 导致 deepseek 限流时兜底落空(户部"零产出"真因)。改为 ollama 实际服务的模型。
    models:
      - openai/qwen3.6-35b-a3b-q4
      - openai/qwen3:4b
    default_model: openai/qwen3.6-35b-a3b-q4
  claude:
    name: Claude via LiteLLM
    api_base: http://127.0.0.1:4444/v1
    api_key_env: LITELLM_KEY
    models:
      - openai/claude-sonnet
      - openai/claude-opus
    default_model: openai/claude-sonnet

  deepseek:
    name: DeepSeek 官方（主力·本地Ollama兜底防掐断）
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    fallback_provider: ollama_local   # 主力挂了/无key 自动落本地 qwen2.5:14b
    models:
    - openai/deepseek-chat
    - openai/deepseek-reasoner
    default_model: openai/deepseek-chat

  minimax:
    name: MiniMax 官方（M2.7 混合专家·1M上下文·中文强）
    api_base: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    models:
    - openai/MiniMax-Text-01
    - openai/MiniMax-M2.7
    default_model: openai/MiniMax-Text-01

  deepseek_minimax:
    name: DeepSeek推理 + MiniMax生成（双模型组合·推理精准+长文强）
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    models:
    - openai/deepseek-reasoner
    default_model: openai/deepseek-reasoner

# ── Harness: Model Tiering (差异化模型策略) ──
# 步骤可通过 tier 字段引用这里的模型配置，而非硬编码模型名
# 用法: 在 flow_*.yaml 的 step 中设置 tier: validation / generation / embedding
model_tiers:
  lite:
    description: 轻量快速任务（归档、格式化、简单步骤）— DeepSeek chat
    model: openai/deepseek-chat
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  smart:
    description: 高质量推理任务（核心分析、方案设计）— DeepSeek R1 推理链
    model: openai/deepseek-reasoner
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  generation:
    description: 核心生成任务（Agent分析、方案撰写）— DeepSeek R1 推理链
    model: openai/deepseek-reasoner
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  validation:
    description: QA评估、Lint校验等验证任务（轻量低成本）— DeepSeek chat
    model: openai/deepseek-chat
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  tool_call:
    description: 工具调用专用（formal tool_call）— DeepSeek chat
    model: openai/deepseek-chat
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  embedding:
    description: 向量化（RAG检索用）
    model: bge-m3
