flow_name: 礼部出版蜂群
qa_domain: general  # 非产品蜂群:豁免 C2需求约束/C3规格实测 产品语义硬核查,只强制 C1 数字勾稽
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: lipu_compose
  name: 撰稿礼官
  description: 基于真实素材成稿,只用素材事实,反编造
  prompt_key: lipu_compose
  prompt_module: src.prompts_lipu
- id: lipu_review
  name: 合规礼官
  description: 发布前防幻觉+合规核查,硬声明无素材支撑标红
  prompt_key: lipu_review
  prompt_module: src.prompts_lipu
- id: lipu_finalize
  name: 发布礼官
  description: 成可发布版+平台适配+摘要标签封面建议
  prompt_key: lipu_finalize
  prompt_module: src.prompts_lipu
- id: qa_tech_support
  name: 质量检查专家
  description: QA核查:稿件接地/无编造/合规/可直接发布
  prompt_key: qa_tech_support
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 成稿(标题+正文)
- 合规核查结论(含标红项)
- 可发布版正文
- 平台适配建议
- 摘要与标签
- 发布前人工处理项

knowledge_pre_retrieval:
  enabled: true
  top_k: 5
  max_tokens: 2000
