flow_name: 郝龙获客Pipeline
max_llm_calls: 60
knowledge_pre_retrieval:
  enabled: true
  top_k: 3
  max_tokens: 1500
  dataset_ids: ${RAGFLOW_DS_MARKET},${RAGFLOW_DS_INTERNAL}
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
flow_tools:
- server: crm
  capabilities:
  - search_customers
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: lead_acquisition
  name: 获客AI
  description: 商机识别与线索评分
  prompt_key: lead_acquisition
  prompt_module: src.prompts_haolong
- id: lead_archive
  name: 归档AI
  description: 客户档案构建与去重
  prompt_key: lead_archive
  prompt_module: src.prompts_haolong
  # 客户档案卡9字段契约(2026-07-07 与 flow_voice_sales.yaml 的同名步骤保持一致,
  # 两个flow共用同一份 PROMPT_LEAD_ARCHIVE,字段列表必须同步改)。
  output_rules:
  - type: required_fields
    fields:
    - 客户名称
    - 客户类型
    - 行业
    - 地域
    - 需求摘要
    - 商机评级
    - 预算范围
    - 紧迫程度
    - 决策链
- id: lead_outreach
  name: 触达AI
  description: 触达策略与沟通话术
  prompt_key: lead_outreach
  prompt_module: src.prompts_haolong
- id: content_publish
  name: 发布AI
  description: 营销内容生成与分发策略
  prompt_key: content_publish
  prompt_module: src.prompts_haolong
- id: qa_tech_support
  name: 质量检查专家
  description: QA质量检查与综合输出
  prompt_key: haolong_qa
  prompt_module: src.prompts_haolong
  assertions:
    # 内核复用(零Python):无真情报核实源时,线索真伪/客户动态等断言必须标信源或"待核",
    # 否则把未核实线索当真投入资源=情报无源。real_search 桥装好后升级为真客户核验。
    post:
    - type: disclaimer_when_unverified
      facts_key: intel_docs
      markers:
      - 待核
      - 无信源
      - 未核实
      - 信源
      - 需核实
      on_fail: hard_fail
repair:
  enabled: true
  max_retries: 1
  min_score: 3.0
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 线索评分
- 客户档案
- 触达策略
- 沟通话术
- 营销内容
- 分发计划
