servers:
  ddg_search:
    transport: stdio
    command: python3 mcp_servers/ddgs_server.py
    description: DuckDuckGo 搜索（完全免费·无 Key·中英文·实时）
    tools:
    - name: ddg_search
      description: DuckDuckGo 关键词搜索（免费·实时·中英文）
      approval_level: none
      parameters:
        type: object
        properties:
          query: {type: string, description: 搜索关键词}
          max_results: {type: integer, default: 5}
          region: {type: string, default: cn-zh}
        required: [query]
    - name: ddg_news
      description: DuckDuckGo 新闻搜索（行业动态/招标/竞品）
      approval_level: none
      parameters:
        type: object
        properties:
          query: {type: string, description: 新闻关键词}
          max_results: {type: integer, default: 5}
          timelimit: {type: string, default: w}
        required: [query]

  web_search:
    transport: stdio
    command: python3 mcp_servers/web_search_server.py
    description: Web 实时搜索（Tavily Search(需key) + Jina URL Reader(免费)）
    tools:
    - name: web_search
      description: 搜索互联网实时信息（竞品价格/行业动态/招标公告/技术规格）
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词
          max_results:
            type: integer
            description: 返回结果数量（1-10，默认5）
            default: 5
          search_depth:
            type: string
            enum: [basic, advanced]
            default: basic
        required: [query]
    - name: fetch_url
      description: 抓取指定 URL 转为干净文本（竞品官网/招标详情页/行业报告）
      approval_level: none
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 要抓取的网页 URL
          max_chars:
            type: integer
            description: 最大字符数（默认3000）
            default: 3000
        required: [url]
  mock:
    transport: mock
    description: 内置模拟服务器，用于开发和测试工具链路
    tools:
    - name: search_contacts
      description: 搜索客户联系人信息
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词（公司名/联系人名/行业）
          limit:
            type: integer
            description: 最大返回条数
            default: 5
        required:
        - query
    - name: prepare_email_draft
      description: 生成邮件草稿（不直接发送，需人工确认）
      approval_level: draft
      parameters:
        type: object
        properties:
          to:
            type: string
            description: 收件人邮箱
          subject:
            type: string
            description: 邮件主题
          body:
            type: string
            description: 邮件正文
        required:
        - to
        - subject
        - body
  crm:
    transport: stdio
    command: python3 mcp_servers/crm_server.py
    description: CRM 客户关系管理系统
    tools:
    - name: search_customers
      description: 搜索客户联系人（按关键词、地区、行业）
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词
          limit:
            type: integer
            description: 最大返回条数
            default: 5
        required:
        - query
    - name: get_customer_detail
      description: 获取客户详情（按客户ID）
      approval_level: none
      parameters:
        type: object
        properties:
          customer_id:
            type: string
            description: 客户ID
        required:
        - customer_id
    - name: create_lead
      description: 创建销售线索（需审批）
      approval_level: draft
      parameters:
        type: object
        properties:
          customer_id:
            type: string
            description: 关联客户ID
          opportunity:
            type: string
            description: 商机描述
          estimated_value:
            type: string
            description: 预估金额
          priority:
            type: string
            enum:
            - high
            - medium
            - low
            description: 优先级
        required:
        - customer_id
        - opportunity
    - name: prepare_email_draft
      description: 准备邮件草稿（不直接发送，需人工确认）
      approval_level: draft
      parameters:
        type: object
        properties:
          to:
            type: string
            description: 收件人邮箱
          subject:
            type: string
            description: 邮件主题
          body:
            type: string
            description: 邮件正文
        required:
        - to
        - subject
        - body
  email:
    transport: stdio
    command: python3 mcp_servers/email_server.py
    description: 邮件发送服务
    tools:
    - name: prepare_email_draft
      description: 准备邮件草稿（需人工确认后发送）
      approval_level: draft
      parameters:
        type: object
        properties:
          to:
            type: string
            description: 收件人邮箱
          subject:
            type: string
            description: 邮件主题
          body:
            type: string
            description: 邮件正文
          priority:
            type: string
            enum:
            - high
            - normal
            - low
            description: 优先级
        required:
        - to
        - subject
        - body
    - name: send_notification
      description: 发送系统通知（自动执行，用于内部预警）
      approval_level: none
      parameters:
        type: object
        properties:
          to:
            type: string
            description: 收件人
          subject:
            type: string
            description: 主题
          body:
            type: string
            description: 内容
        required:
        - to
        - subject
        - body
  xiaohongshu:
    transport: stdio
    command: python3 mcp_servers/xiaohongshu_server.py
    description: 小红书社媒内容检索
    tools:
    - name: search_notes
      description: 搜索小红书笔记（关键词+标签）
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词
          limit:
            type: integer
            description: 最大返回条数
            default: 5
          sort_by:
            type: string
            enum:
            - relevance
            - likes
            - date
            description: 排序方式
        required:
        - query
    - name: get_note_detail
      description: 获取小红书笔记详情
      approval_level: none
      parameters:
        type: object
        properties:
          note_id:
            type: string
            description: 笔记ID
        required:
        - note_id
    - name: search_competitors
      description: 搜索竞品在小红书的营销动态
      approval_level: none
      parameters:
        type: object
        properties:
          brand:
            type: string
            description: 竞品品牌名
        required:
        - brand
  knowledge_rag:
    transport: stdio
    command: python3 mcp_servers/rag_server.py
    description: 知识库 RAG 检索（文档/标准/历史方案语义搜索）
    tools:
    - name: search_docs
      description: 搜索公司知识库（技术文档、产品手册、行业标准、历史方案）
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词或问题描述
          top_k:
            type: integer
            description: 返回最相关的文档数
            default: 3
        required:
        - query
    - name: knowledge_stats
      description: 查看知识库统计信息
      approval_level: none
      parameters:
        type: object
        properties: {}
  skill_example_weather:
    transport: stdio
    command: python3 skills/example_weather/server.py
    description: 天气查询示例 Skill
    tools:
    - name: get_weather
      description: 查询当前天气
      approval_level: none
      parameters:
        type: object
        properties:
          city:
            type: string
            description: 城市名
        required:
        - city
    - name: get_weather_forecast
      description: 查询天气预报
      approval_level: none
      parameters:
        type: object
        properties:
          city:
            type: string
            description: 城市名
          days:
            type: integer
            default: 3
        required:
        - city
  wechat_outreach:
    transport: stdio
    command: python3 mcp_servers/wechat_server.py
    description: 微信/企微/Bark推送工具（Bark推iOS，环境变量BARK_DEVICE_KEY控制）
    tools:
    - name: add_wechat_contact
      description: 添加微信好友（销售后续触达，当前为 mock 模式）
      approval_level: draft
      parameters:
        type: object
        properties:
          phone:
            type: string
            description: 客户手机号
          greeting:
            type: string
            description: 好友申请验证语（简短，不超过30字）
          remark:
            type: string
            description: 备注名（选填）
        required: [phone, greeting]
    - name: send_wechat_message
      description: 向已添加的微信好友发送消息
      approval_level: draft
      parameters:
        type: object
        properties:
          wechat_id:
            type: string
            description: 微信 ID 或手机号
          content:
            type: string
            description: 消息内容
          type:
            type: string
            enum: [text, image, file]
            default: text
        required: [wechat_id, content]
  claude_code_bridge:
    transport: stdio
    command: python3 mcp_servers/claude_code_bridge.py
    scope: step
    description: Claude Code 工具桥 — 供方向B Agent 调用文件系统和 Shell 工具
    tools:
    - name: Read
      description: 读取文件内容（绝对路径，支持 offset/limit）
      approval_level: none
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: 绝对文件路径
          offset:
            type: integer
            description: 起始行（0-based，默认0）
            default: 0
          limit:
            type: integer
            description: 最多读取行数（默认2000）
            default: 2000
        required: [file_path]
    - name: Write
      description: 写入文件（覆盖，绝对路径）
      approval_level: draft
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: 绝对文件路径
          content:
            type: string
            description: 写入内容
        required: [file_path, content]
    - name: Edit
      description: 字符串替换（精确匹配，绝对路径）
      approval_level: draft
      parameters:
        type: object
        properties:
          file_path:
            type: string
            description: 绝对文件路径
          old_string:
            type: string
            description: 要替换的原始字符串
          new_string:
            type: string
            description: 替换后的字符串
          replace_all:
            type: boolean
            description: 是否替换所有匹配（默认 false）
            default: false
        required: [file_path, old_string, new_string]
    - name: Bash
      description: 执行 shell 命令（禁止 rm -rf/dd/mkfs 等危险命令，超时强制 kill）
      approval_level: draft
      parameters:
        type: object
        properties:
          command:
            type: string
            description: shell 命令
          timeout:
            type: integer
            description: 超时秒数（默认30，最大60）
            default: 30
        required: [command]
    - name: Grep
      description: ripgrep 搜索（rg 不可用时 fallback 到 grep）
      approval_level: none
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: 正则表达式
          path:
            type: string
            description: 搜索路径（默认当前目录）
            default: "."
          glob:
            type: string
            description: 文件过滤 glob（如 *.py）
          output_mode:
            type: string
            enum: [files_with_matches, content, count]
            description: 输出模式（默认 files_with_matches）
            default: files_with_matches
        required: [pattern]
    - name: Glob
      description: 文件路径 glob 匹配，按修改时间排序
      approval_level: none
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: glob 模式（如 **/*.py）
          path:
            type: string
            description: 搜索根目录（默认当前目录）
            default: "."
        required: [pattern]

  ima:
    transport: stdio
    command: python3 mcp_servers/ima_server.py
    description: IMA 知识库（腾讯 ima.qq.com）— 搜索、浏览、归档行业知识
    tools:
    - name: ima_search_knowledge
      description: 在 IMA 知识库中语义搜索，返回相关文档标题和高亮片段
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词或问题
          knowledge_base_id:
            type: string
            description: 知识库 ID（不知道时先调用 ima_list_knowledge_bases）
          limit:
            type: integer
            description: 最多返回条数（默认10）
            default: 10
        required: [query, knowledge_base_id]
    - name: ima_list_knowledge_bases
      description: 列出用户在 IMA 中有权访问的知识库（返回 ID 和名称）
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 按名称过滤（空字符串返回全部）
            default: ""
        required: []
    - name: ima_browse_knowledge
      description: 浏览 IMA 知识库目录，列出文件和文件夹
      approval_level: none
      parameters:
        type: object
        properties:
          knowledge_base_id:
            type: string
            description: 知识库 ID
          folder_id:
            type: string
            description: 文件夹 ID（省略则浏览根目录）
          limit:
            type: integer
            description: 每页条数（1-50）
            default: 20
        required: [knowledge_base_id]
    - name: ima_add_url
      description: 将网页或微信公众号文章添加到 IMA 知识库（需审批）
      approval_level: draft
      parameters:
        type: object
        properties:
          urls:
            type: array
            items:
              type: string
            description: URL 列表（1-10 个）
          knowledge_base_id:
            type: string
            description: 目标知识库 ID
        required: [urls, knowledge_base_id]
    # ── notes 工作流（团队 RAG 主路径，能直接读笔记完整正文）──
    - name: ima_search_notes
      description: 搜索 IMA 笔记，返回标题/摘要/doc_id；按 doc_id 调 ima_get_note_content 读全文
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词
          search_type:
            type: integer
            description: 0=按标题搜（默认）, 1=按正文全文搜
            default: 0
          limit:
            type: integer
            description: 最多返回条数（默认 10）
            default: 10
        required: [query]
    - name: ima_get_note_content
      description: 读取指定笔记的完整正文（纯文本），doc_id 来自 ima_search_notes
      approval_level: none
      parameters:
        type: object
        properties:
          doc_id:
            type: string
            description: 笔记 doc_id
        required: [doc_id]
    - name: ima_list_notebooks
      description: 列出所有 IMA 笔记本，返回 folder_id + 名称
      approval_level: none
      parameters:
        type: object
        properties:
          limit:
            type: integer
            description: 数量上限（默认 20）
            default: 20
        required: []
    - name: ima_get_media_info
      description: 获取知识库文件的下载 URL（含签名 header）。返回的 URL 5 分钟内有效，需立即下载
      approval_level: none
      parameters:
        type: object
        properties:
          media_id:
            type: string
            description: 知识库文件 media_id（来自 ima_search_knowledge / ima_browse_knowledge）
        required: [media_id]

  max_tool_rounds: 5
  result_max_chars: 2000
  draft_storage: drafts
  global_tools:
  - server: email
    capabilities:
    - send_notification

sse_examples:
  remote_rag:
    transport: sse
    url: http://remote-server:8080/mcp
    description: 远程 MCP Server 示例（SSE transport）
    timeout_seconds: 30
    headers:
      Authorization: Bearer ${REMOTE_MCP_TOKEN}
    tools:
    - name: search_docs
      description: 远程文档检索
      approval_level: none
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词
          top_k:
            type: integer
            description: 返回结果数量
            default: 5
        required: [query]
  remote_analytics:
    transport: sse
    url: http://analytics-server:9000/mcp
    description: 远程分析服务示例
    timeout_seconds: 60
    tools:
    - name: analyze_data
      description: 数据分析
      approval_level: none
      parameters:
        type: object
        properties:
          dataset:
            type: string
            description: 数据集名称
          metrics:
            type: array
            items:
              type: string
            description: 指标列表
        required: [dataset]
