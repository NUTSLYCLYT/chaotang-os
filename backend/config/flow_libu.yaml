flow_name: 吏部人才蜂群
qa_domain: general  # 非产品蜂群:豁免 C2需求约束/C3规格实测 产品语义硬核查,只强制 C1 数字勾稽
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: libu_profile
  name: 岗位画像参谋
  description: 岗位画像+胜任力模型+软性优先+行业资质红线
  prompt_key: libu_profile
  prompt_module: src.prompts_libu
- id: libu_screen
  name: 简历筛选参谋
  description: 硬性门槛+软性优先+分档处理+薪资期望管理
  prompt_key: libu_screen
  prompt_module: src.prompts_libu
- id: libu_interview
  name: 面试设计参谋
  description: 结构化题(STAR)+评分锚点+红线问题+面试流程
  prompt_key: libu_interview
  prompt_module: src.prompts_libu
- id: qa_tech_support
  name: 质量检查专家
  description: QA核查:画像清晰/有筛选标准/面试题对岗/评分与红线齐全
  prompt_key: qa_tech_support
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 岗位画像与胜任力模型
- 简历筛选标准(硬/软)
- 候选人分档处理建议
- 结构化面试题(STAR)
- 评分标准与红线问题
- 面试流程设计

knowledge_pre_retrieval:
  enabled: true
  top_k: 5
  max_tokens: 2000
