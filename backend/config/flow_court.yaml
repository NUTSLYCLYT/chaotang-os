default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_model: openai/swarm-worker
flow_name: 三省六部朝堂治理流
qa_domain: general  # 非产品蜂群:豁免 C2需求约束/C3规格实测 产品语义硬核查,只强制 C1 数字勾稽
default_retry:
  max_retries: 2
  delay: 3
  backoff: 2
  retry_on:
  - error
output_fields:
- 执行结论
- 关键风险
- 下一步行动
- 质量评级
steps:
- id: taizi_intake
  name: 👑 太子
  description: 接旨·战略研判
  prompt_key: taizi_intake
  prompt_module: src.prompts_court
  output_rules:
  - type: required_sections
    sections:
    - 战略研判
    - 核心指令
    - 涉及领域
    - 风险提示
  - type: min_length
    chars: 150
  - type: not_empty
  skip_injection_check: true
- id: zhongshu_analyze
  name: 📜 中书省
  description: 方案拟制·任务拆解
  depends_on:
  - taizi_intake
  edge_labels:
    taizi_intake: 收旨研判
  prompt_key: zhongshu_analyze
  prompt_module: src.prompts_court
  lint_max_retries: 2
  output_rules:
  - type: required_sections
    sections:
    - 任务拆解
    - 派单计划
    - 涉及六部
  - type: min_length
    chars: 200
  - type: not_empty
  skip_injection_check: true
- id: menxia_review
  name: 🛡️ 门下省
  description: 审议·准奏或封驳
  depends_on:
  - zhongshu_analyze
  edge_labels:
    zhongshu_analyze: 方案呈报
  prompt_key: menxia_review
  prompt_module: src.prompts_court
  lint_max_retries: 2
  output_pattern_repair:
    pattern: 'VERDICT: 封驳'
    restart_from_id: zhongshu_analyze
    max_restarts: 2
    display_label: 封驳退回
  output_rules:
  - type: required_sections
    sections:
    - 审议结论
    - 审议意见
  - type: format_regex
    pattern: 'VERDICT: (准奏|封驳)'
  - type: not_empty
  skip_injection_check: true
- id: shangshu_dispatch
  name: 🏛️ 尚书省（派单）
  description: 接令·按部门派发任务
  depends_on:
  - menxia_review
  edge_labels:
    menxia_review: 审议通过
  run_if: '''VERDICT: 准奏'' in prev_output'
  prompt_key: shangshu_dispatch
  prompt_module: src.prompts_court
  output_rules:
  - type: required_sections
    sections:
    - 派单清单
    - 执行指令
    - 预期产出
  - type: min_length
    chars: 200
  - type: not_empty
  skip_injection_check: true
- id: liubu_execute
  name: ⚙️ 六部执行
  description: 工部/户部/礼部/刑部/兵部执行各自任务
  depends_on:
  - shangshu_dispatch
  prompt_key: liubu_execute
  prompt_module: src.prompts_court
  output_rules:
  - type: required_sections
    sections:
    - 工部产出
    - 执行状态
  - type: not_empty
  skip_injection_check: true
- id: zhuangyuan_analyze
  name: 🏡 庄园分析
  description: legal/finance 庄园能力层
  depends_on:
  - shangshu_dispatch
  edge_labels:
    shangshu_dispatch: 需要领域能力
  prompt_key: zhuangyuan_analyze
  prompt_module: src.prompts_court
  output_rules:
  - type: not_empty
  skip_injection_check: true
- id: shangshu_aggregate
  name: 🏛️ 尚书省（汇总）
  description: 汇总六部执行结果
  depends_on:
  - liubu_execute
  - zhuangyuan_analyze
  prompt_key: shangshu_aggregate
  prompt_module: src.prompts_court
  output_rules:
  - type: required_sections
    sections:
    - 执行摘要
    - 各部产出
    - 风险汇总
  - type: min_length
    chars: 200
  - type: not_empty
  skip_injection_check: true
- id: zhongshu_conclude
  name: 📜 中书省（复核）
  description: 复核最终结论
  depends_on:
  - shangshu_aggregate
  prompt_key: zhongshu_conclude
  prompt_module: src.prompts_court
  output_rules:
  - type: required_sections
    sections:
    - 复核结论
    - 质量评级
  - type: not_empty
  skip_injection_check: true
- id: taizi_output
  name: 👑 太子（回传）
  description: 收口·对上回传
  depends_on:
  - zhongshu_conclude
  prompt_key: taizi_output
  prompt_module: src.prompts_court
  tier: validation
  output_rules:
  - type: required_sections
    sections:
    - 执行结论
    - 关键风险
    - 下一步行动
  - type: not_empty
  skip_injection_check: true
- id: qa_tech_support
  name: 质量检查专家
  description: 朝堂治理流全链路质量评估
  prompt_key: court_qa
  prompt_module: src.prompts_court
  skip_injection_check: true
  depends_on:
  - taizi_output
  assertions:
    # customer_invariant 复用(纯YAML零Python):court 无验证数据源(knowledge_pre_retrieval=None),
    # 故最终治理结论必须诚实标注"待核",否则把臆测当已核实事实呈报=编证据刷分,hard_fail。
    # 把 C3/C5 诚实标注从 LLM 自评升格为机判闸。
    post:
    - type: disclaimer_when_unverified
      facts_key: verified_facts
      markers:
      - 待核
      - 需核实
      - 未经核实
      - 低置信
      on_fail: hard_fail
qa_version: v3
# QA 驱动的全局修复（与上游 output_pattern_repair 门下封驳机制互补、独立）
repair:
  enabled: true
  max_retries: 1
  min_score: 3.5
  min_delta: 0.2
  min_dimension_score: 3.0
