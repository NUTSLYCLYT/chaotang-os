# 全局尾部流程。
# 用于把每个核心蜂群的尾部收敛为：QA -> 红蓝对抗 -> 大神评审 -> 最终汇总 -> 知识归档。
tail_flow_id: global_quality_tail
name: 全局 QA + 红蓝对抗 + 大神评审尾部流程
default_runtime: subagent
applies_to:
  default: core_and_high_risk
  include_categories:
    - core_business
    - rnd_delivery
    - functional_support
    - governance_ops
  exclude_swarms:
    - ima

runtime_strategy:
  subagent:
    use_for:
      - qa
      - critic
      - persona_review
      - finalization
  openclaw:
    use_for:
      - long_running_manor
      - external_tool_work
      - cross_task_memory
    fallback: subagent

steps:
  - id: qa_tech_support
    name: 质量检查专家
    role: 结构、事实、完整性、风险和可执行性评分
    prompt_key: qa_tech_support
    runtime: subagent
    required: true

  - id: critic_challenge
    name: 红蓝对抗质疑专家
    role: 专门寻找后 20% 问题、失败路径和不可恢复风险
    prompt_key: critic
    runtime: subagent
    required_when:
      - risk_level in [medium, high, critical]
      - qa.total_score < 4.5
      - flow.tail_policy.critic.enabled == true

  - id: persona_review
    name: 大神评审团
    role: 从多个高阶人格视角做战略、风险、产品和工程审查
    config: config/review_committee.yaml
    runtime: subagent
    required_when:
      - critic.has_challenge == true
      - risk_level in [high, critical]
      - flow.tail_policy.persona_review.enabled == true

  - id: final_decision_memo
    name: 最终决策备忘录
    role: 汇总执行结果、反对意见、采纳理由和下一步验证指标
    runtime: subagent
    required: true
    output_sections:
      - 背景
      - 目标
      - 关键结论
      - Agent 分歧
      - 红蓝对抗
      - 大神评审
      - 最终决定
      - 后续验证指标

  - id: ima_archive
    name: IMA 知识归档
    role: 将高质量结果、争论过程和失败教训归档
    target_swarm: ima
    runtime: swarm
    required_when:
      - final_decision_memo.quality >= 4.0
      - archiveable == true
