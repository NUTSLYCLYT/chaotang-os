# TEST-ONLY(2026-07-04标注):flow_opc.yaml的多模型配置示例,非独立业务能力,未注册进
# swarm_orchestrator.yaml。计"33个flow"时不算业务蜂群,见 docs/chaotang_workflow_swarm_upgrade_2026-06-07.md
flow_name: "OPC市场方案流程 - 多模型示例"
qa_version: "v3"
# 默认模型配置（如果 step 未指定 model，则使用此配置）
# 注：active provider 注入会覆盖以下三个 default_* 字段，这里仅作 fallback
default_model: "openai/qwen-plus"
default_api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
default_api_key_env: "DASHSCOPE_API_KEY"

steps:
  - id: "opc_leader"
    name: "OPC负责人"
    description: "任务分解与目标定义（示例：step 不指定 model，使用 default）"
    prompt_key: "opc_leader"

  - id: "market_intel"
    name: "市场情报专家"
    description: "市场与竞品情报分析"
    prompt_key: "market_intel"
    # 如果你有其他模型（如 GPT-4o），可以这样配置：
    # model: "gpt-4o"
    # api_base: "https://api.openai.com/v1"
    # api_key_env: "OPENAI_API_KEY"

  - id: "solution_architect"
    name: "解决方案架构师"
    description: "技术方案设计"
    prompt_key: "solution_architect"

  - id: "customer_success"
    name: "客户成功经理"
    description: "客户价值表达转化"
    prompt_key: "customer_success"

  - id: "qa_tech_support"
    name: "技术支持专家"
    description: "QA质量检查与综合输出"
    prompt_key: "qa_tech_support"

output_fields:
  - "客户背景"
  - "核心需求"
  - "市场分析"
  - "竞品情况"
  - "解决方案"
  - "客户价值"
  - "风险与建议"
