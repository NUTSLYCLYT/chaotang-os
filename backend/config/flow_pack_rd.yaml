default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_model: openai/swarm-worker
default_retry:
  backoff: 2
  delay: 3
  max_retries: 2
  retry_on:
  - error
flow_name: PACK研发蜂群流程
flow_tools:
- capabilities:
  - ima_search_notes
  - ima_get_note_content
  - ima_list_notebooks
  - ima_search_knowledge
  - ima_list_knowledge_bases
  - ima_get_media_info
  server: ima
ima_pre_retrieval:
  enabled: true
  knowledge_base_id: LQwD0jsCJ6DQQHd06ahTFxsNg_q0oBQ83fJDrSms7MU=

# 本地知识检索（IMA 不可用时兜底，battery_tech 含低温放电/内阻/BMS 选型知识）
knowledge_pre_retrieval:
  enabled: true
  top_k: 4
  max_tokens: 2000
layout_override:
  pack_rd_leader:
    x: 427
    y: -286.00000000000006
  presale_cost_estimator:
    x: 200
    y: -500
  supply_chain_feasibility:
    x: 200
    y: -250
  bms_hw_engineer:
    x: 0
    y: 520
  cell_engineer:
    x: 428.9416519259927
    y: 14.991564096837013
  bms_sw_engineer:
    x: 312
    y: 844
  structure_thermal_engineer:
    x: 1000
    y: 520
  pack_reliability_tester:
    x: 577
    y: 538
  bms_summary:
    x: 115.00000000000028
    y: 1100
  process_test_summary:
    x: 820
    y: 830
  cross_module_checker:
    x: 408.0000000000001
    y: 1325
  expert_review_gate:
    x: 408
    y: 1550
  pack_summary_expert:
    x: 484
    y: 1862
  qa_tech_support:
    x: 506
    y: 2182
  critic_challenge:
    x: 528
    y: 2452
max_llm_calls: 150
output_fields:
- 需求规格
- 售前成本核算
- 供应链可行性评估
- BMS选型方案
- 通信协议适配方案
- 结构热设计方案
- PACK工艺方案
- 测试验证方案
- 五维度评审结论
- 系统BOM汇总
- 风险与建议
knowledge_inject:
  file: "config/eval/cell_library.json"  # 电芯真值库单一来源(实测197芯)
  max_tokens: 4000
qa_version: v3
repair:
  critic_before_repair: true
  enabled: true
  max_retries: 1
  min_score: 3.5
steps:
- description: '① 需求必须量化：每项指标必须有明确数值。如 -30℃放电容量保持率≥80%，禁止模糊描述

    ② 里程碑必须同时列出最大风险+预案

    ③ 分工必须有：做什么+交付物格式+完成时间

    ④关键技术路线必须给出唯一推荐，禁止并列/范围

    ⑤ 启动前先调 ima_search_notes(query="PACK", search_type=1) 查公司有无相关研发笔记；
    命中后用 ima_get_note_content 读取正文，作为方案依据。命中 0 条时直接基于客户需求设计。'
  id: pack_rd_leader
  lint_max_retries: 2
  max_tokens: 2500
  name: 研发负责人
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections:
    - 需求规格
    - 整体研发方案
    - 里程碑
    - 任务指令
    - 风险
    type: required_sections
  prompt_key: pack_rd_leader
  prompt_module: src.prompts_pack_rd
  tools:
  - capabilities:
    - ima_search_notes
    - ima_get_note_content
    server: ima

# 售前成本核算已 move 到 process_test_summary 之后做"精算"（见文件末尾 presale_cost_estimator）。
# 删早期成本边：BOM 具体数字对 cell/supply/bms 是假边（Falsify 证伪），下游只需"成本量级感觉"，
# 由 cell_engineer 的真实物料清单 + supply_chain 门控 + 精算阶段的确定性闸承接（铁律3：净负行数）。

- depends_on:
  - pack_rd_leader
  description: '阻断型供应链门控（Andy Grove断路器原则）——关键物料批量采购可行性+供应商备选评估+交期验证。
    核心问题：当主供应商断供时，方案还能执行吗？
    结论为❌时流程完全停止，不进入设计阶段，返回研发负责人重新规划。
    关键物料必须各有至少1个备选供应商，否则标注❌。'
  edge_labels:
    pack_rd_leader: L0.5 供应链门控（阻断型）
  id: supply_chain_feasibility
  max_tokens: 1500
  name: 供应链可行性门控
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 关键物料供应链评估
    - 供应链风险清单
    - 供应链可行性结论
    type: required_sections
  - patterns:
    - description: 禁止模糊的一般情况下表述
      pattern: 一般情况下
    type: forbidden_patterns
  prompt_key: supply_chain_feasibility
  prompt_module: src.prompts_pack_rd

- critic: true
  critic_mode: strict
  critic_max_retries: 2
  depends_on:
  - supply_chain_feasibility
  # 摘假边(Falsify): 电芯选型只由需求规格(能量/电压/倍率/温度)驱动 + 供应链门控放行，
  # 零依赖 presale 的 ¥/BOM。白名单显式锁死可见上游，杜绝 BOM 数字机械混入上下文。
  context_steps:
  - pack_rd_leader
  - supply_chain_feasibility
  description: '电芯工程师给下游的是：容量/串数/电压窗口/低温放电保持率（算法参数锚点）。

    选型前先调 ima_search_notes(query="电芯 低温", search_type=1) 查公司是否有现成电芯规格笔记；
    命中后用 ima_get_note_content 读取正文，优先选用已验证型号。命中 0 条时基于客户需求自由选型。'
  edge_labels:
    supply_chain_feasibility: 供应链通过后才启动并行设计
  id: cell_engineer
  max_tokens: 3000
  name: 电芯工程师
  knowledge_scope:
  - battery_tech
  - 购销合同
  output_rules:
  - type: not_empty
  - chars: 600
    type: min_length
  - type: no_refusal
  - sections:
    - 推荐方案
    - 电气拓扑
    - 候选
    - 推荐
    - 下游
    type: required_sections
  - sections:
    - 关键参数速查表
    type: required_sections
  prompt_key: cell_engineer
  prompt_module: src.prompts_pack_rd
  tools:
  - capabilities:
    - ima_search_notes
    - ima_get_note_content
    server: ima

- depends_on:
  - cell_engineer
  # 摘假边(Falsify): BMS 选型只依赖需求规格 + 电芯电气参数(串数/电压窗口/电流)，
  # 自查市场参考价/片，零依赖 presale 的 ¥/BOM。白名单显式锁死可见上游。
  context_steps:
  - pack_rd_leader
  - cell_engineer
  description: '外购BMS成品模块选型匹配——不做PCB设计，不做原理图，只做选型。
    输出：BMS选型对比表(型号/供应商/价格/认证/通信接口)+电气匹配验证+供应商资质评估+通信接口清单（移交通信协议适配工程师）。
    必须提供主选+备选各1个供应商对比。'
  edge_labels:
    cell_engineer: L2. 三路并行，都依赖电芯工程师
  id: bms_hw_engineer
  max_tokens: 2500
  name: BMS选型工程师
  knowledge_scope:
  - battery_tech
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - BMS选型对比表
    - 电气匹配验证
    - 供应商资质评估
    - 通信接口清单
    type: required_sections
  prompt_key: bms_hw_engineer
  prompt_module: src.prompts_pack_rd

- depends_on:
  - cell_engineer
  - bms_hw_engineer
  description: '基于BMS选型工程师移交的通信接口清单，完成RS485/CAN/蓝牙协议对接方案+数据帧定义+调试验证+客户对接文档。
    不开发固件，不写SOC算法，不做MCU程序开发。
    协议参数必须引用BMS选型工程师的通信接口清单，不得自行假设。'
  edge_labels:
    bms_hw_engineer: L3. 依赖BMS选型完成后才能设计协议对接
  id: bms_sw_engineer
  max_tokens: 2500
  name: 通信协议适配工程师
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 通信协议对接方案
    - 协议差异与适配方案
    - 调试与验证方案
    - 客户对接技术交底文档大纲
    type: required_sections
  prompt_key: bms_sw_engineer
  prompt_module: src.prompts_pack_rd

- depends_on:
  - cell_engineer
  edge_labels:
    cell_engineer: L2. 三路并行，都依赖电芯工程师
  id: structure_thermal_engineer
  max_tokens: 2500
  name: 结构&热设计&PACK工艺工程师
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections:
    - 结构设计方案
    - 低温热管理方案
    - PACK工艺方案
    - 试产移交准备
    type: required_sections
  prompt_key: structure_thermal_engineer
  prompt_module: src.prompts_pack_rd

- depends_on:
  - cell_engineer
  edge_labels:
    cell_engineer: L2. 三路并行，都依赖电芯工程师
  id: pack_reliability_tester
  max_tokens: 3500
  name: 测试&可靠性工程师
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections:
    - 电性能测试方案
    - 低温专项测试方案
    - 可靠性测试方案
    - 认证预测试规划
    - 综合风险评估与判定
    - 测试排期甘特表
    type: required_sections
  - fields:
    - ℃
    - C放电
    - D+
    type: required_fields
  - patterns:
    - description: 禁止模糊的建议验证表述，必须给出明确测试参数
      pattern: 建议.*验证
    - description: 禁止待确认，必须给出明确数值或判定标准
      pattern: 待确认
    type: forbidden_patterns
  prompt_key: pack_reliability_tester
  prompt_module: src.prompts_pack_rd

- context_steps:
  - bms_hw_engineer
  - bms_sw_engineer
  - cell_engineer
  depends_on:
  - bms_hw_engineer
  - bms_sw_engineer
  description: 整合BMS选型方案/通信协议适配方案与电芯电气规格，输出精炼BMS专项摘要
  id: bms_summary
  max_tokens: 2500
  tier: lite
  name: BMS专项汇总
  no_tools: true
  output_rules:
  - type: not_empty
  - chars: 200
    type: min_length
  - type: no_refusal
  - sections:
    - 电芯电气规格
    - BMS选型方案
    - 通信协议方案
    - 电气匹配性
    - BMS专项结论
    type: required_sections
  prompt_key: bms_summary
  prompt_module: src.prompts_pack_rd

- context_steps:
  - structure_thermal_engineer
  - pack_reliability_tester
  - cell_engineer
  depends_on:
  - structure_thermal_engineer
  - pack_reliability_tester
  description: 整合结构热设计/测试可靠性方案与电芯物理规格，输出精炼工艺测试专项摘要
  id: process_test_summary
  max_tokens: 2500
  tier: lite
  name: 工艺测试汇总
  no_tools: true
  output_rules:
  - type: not_empty
  - chars: 200
    type: min_length
  - type: no_refusal
  - sections:
    - 电芯物理规格
    - 结构热设计方案
    - 测试可靠性方案
    - 物理适配性
    - 工艺测试专项结论
    type: required_sections
  prompt_key: process_test_summary
  prompt_module: src.prompts_pack_rd

# ── 售前成本核算 move 到此：electrical/物理参数齐备后才做精算（铁律：精算只"选数"，Python"验数"）──
- context_steps:
  - pack_rd_leader
  - cell_engineer
  - bms_summary
  - process_test_summary
  depends_on:
  - cell_engineer
  - bms_summary
  - process_test_summary
  description: '售前成本核算专家 — 在电芯/BMS/工艺物理参数全部确定后做"精算"（非早期粗估）。
    第一性原理正推BOM成本（电芯数×真单价+BMS单价+结构件），并额外吐出 fenced JSON 喂确定性闸。
    电压填 cell_library 真值，单价注[来源:]，禁 LLM 自评算术。
    输出立项申请表三态结论：✅建议立项/⚠️有条件立项/❌不建议立项。'
  edge_labels:
    process_test_summary: L4.0 物理参数齐备后精算
  id: presale_cost_estimator
  max_tokens: 2000
  name: 售前成本核算专家
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections:
    - 初步技术路线
    - BOM成本草算
    - 报价与毛利率预估
    - 立项申请表
    type: required_sections
  # 强制末尾 fenced JSON 机读块（含 series_S/parallel_P），供 sizing/成本 两道确定性闸复核。
  # LLM 间歇漏掉时 lint FAIL → 自愈重试逼出（否则两闸饿死返 UNKNOWN）。
  - type: format_regex
    pattern: '```json[\s\S]*?"series_S"[\s\S]*?"parallel_P"[\s\S]*?```'
    must_match: true
    description: 末尾必须含 fenced JSON 机读块（至少含 series_S 与 parallel_P 字段），供确定性闸机器复核
  # A 修复:仅要求 series_S/parallel_P 会被 LLM 用残缺 JSON(其余 null)糊弄过 lint → 两闸 garbage-in。
  # 强制全字段(带引号 JSON key 形式,防 narrative 误命中),缺任一即 FAIL → 自愈逼出完整机读块。
  - type: required_fields
    fields:
    - '"chemistry"'
    - '"cell_capacity_ah"'
    - '"cell_nominal_v"'
    - '"series_S"'
    - '"parallel_P"'
    - '"c_rate"'
    - '"cell_unit_price"'
    - '"bom_total"'
    - '"target_wh"'
  prompt_key: presale_cost_estimator
  prompt_module: src.prompts_pack_rd
  tools:
  - capabilities:
    - ima_search_notes
    - ima_get_note_content
    server: ima

# ── sizing 确定性闸（no-LLM business_step）：解析精算 fenced JSON → 确定性 sizing + 反作弊核对 ──
# 给确定性串并/电流/热基线，并核对精算 agent 自报 series_S/parallel_P（偏差超带宽 FAIL）。
# 与 cost_validation 同范式：算术不许 LLM 自评，电压不许硬编 ×3.7。expert_review_gate 维度①/② 读。
- step_type: sizing
  context_steps:
  - presale_cost_estimator
  depends_on:
  - presale_cost_estimator
  description: 'sizing 确定性闸：从精算输出抽 fenced JSON，调 src.pack_rd_sizing.run_sizing_gate
    确定性算串并/电流/热损/冷却策略，并核对自报 series_S/parallel_P 是否自洽（防 LLM 瞎报配置）。'
  edge_labels:
    presale_cost_estimator: L4.0 sizing 确定性闸(no-LLM)
  id: sizing_validation
  name: sizing确定性闸
  no_tools: true

# ── 成本确定性闸（no-LLM business_step）：解析精算 fenced JSON → validate_bom → verdict ──
# verdict 写 run_meta + final_output["系统BOM汇总"]末尾；expert_review_gate 维度④ / QA C1 读机器 verdict。
- step_type: cost_validation
  context_steps:
  - presale_cost_estimator
  depends_on:
  - presale_cost_estimator
  description: '成本确定性闸：从精算输出抽 fenced JSON，调 src.pack_rd_cost_validator.validate_bom（真电压/真值锚spec/化学体系join价），
    输出 c1/c7/priceTruth/specTruth 机器判定。算术不许 LLM 自评，电压不许硬编 ×3.7。'
  edge_labels:
    presale_cost_estimator: L4.1 成本确定性闸(no-LLM)
  id: cost_validation
  name: 成本确定性闸
  no_tools: true

- context_steps:
  - bms_summary
  - process_test_summary
  depends_on:
  - bms_summary
  - process_test_summary
  description: '对BMS汇总和工艺测试汇总的跨模块接口参数进行交叉核验，发现矛盾后标注⚠️供下游修正。
    检查项：通信协议一致性/系统能量/电芯数量/重量预算/热计算完整性/可生产性冲突。'
  edge_labels:
    bms_summary: L2.5 跨模块一致性检查
    process_test_summary: L2.5 跨模块一致性检查
  id: cross_module_checker
  max_tokens: 2500
  name: 跨模块一致性检查员
  no_tools: true
  output_rules:
  - type: not_empty
  - chars: 100
    type: min_length
  - type: no_refusal
  - sections:
    - 跨模块一致性检查报告
    type: required_sections
  prompt_key: cross_module_checker
  prompt_module: src.prompts_pack_rd

- context_steps:
  - bms_summary
  - process_test_summary
  - cross_module_checker
  - presale_cost_estimator
  - sizing_validation
  - cost_validation
  - supply_chain_feasibility
  depends_on:
  - cross_module_checker
  - presale_cost_estimator
  - sizing_validation
  - cost_validation
  - supply_chain_feasibility
  description: '五维度技术评审门（公司体系文件规定五大维度）：
    ① 客户需求符合性（必须引用 sizing_validation 机器 verdict：串并自洽/电压平台；闸 FAIL 则维度①判❌或⚠️，禁 LLM 自评串并）
    ② 可生产性（参考 sizing_validation 的热/冷却策略与峰值电流基线）
    ③ 物料可批量采购性
    ④ 生产成本合理性（必须引用 cost_validation 机器 verdict：c1/priceTruth/specTruth；闸 FAIL 则维度④判❌或⚠️，禁 LLM 自评算术）
    ⑤ 产品可测试性
    任一维度❌则打回对应工程师重新设计，不进入汇总阶段。
    每个维度输出三态：✅通过/⚠️有条件通过（含整改要求+截止时间）/❌阻塞（含打回原因）。'
  edge_labels:
    cross_module_checker: L2.6 五维度技术评审门
    presale_cost_estimator: 成本合理性维度输入
    sizing_validation: sizing确定性闸机器verdict
    cost_validation: 成本确定性闸机器verdict
    supply_chain_feasibility: 批量采购可行性维度输入
  id: expert_review_gate
  max_tokens: 3000
  name: 五维度技术评审门
  no_tools: true
  output_rules:
  - type: not_empty
  - chars: 600
    type: min_length
  - type: no_refusal
  - sections:
    - 维度1
    - 维度2
    - 维度3
    - 维度4
    - 维度5
    - 五维度总体评审结论
    type: required_sections
  prompt_key: expert_review_gate
  prompt_module: src.prompts_pack_rd

- context_steps:
  - bms_summary
  - process_test_summary
  - cross_module_checker
  - expert_review_gate
  depends_on:
  - expert_review_gate
  edge_labels:
    expert_review_gate: L5. 五维度评审通过后汇总
