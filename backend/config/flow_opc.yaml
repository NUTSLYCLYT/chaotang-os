default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_model: openai/swarm-quick
default_retry:
  backoff: 2
  delay: 3
  max_retries: 2
  retry_on:
  - error
flow_name: OPC市场方案流程
max_llm_calls: 60
knowledge_inject:
  file: knowledge/battery_prices.yaml
  max_tokens: 2000
knowledge_pre_retrieval:
  dataset_ids: ${RAGFLOW_DS_INDUSTRY},${RAGFLOW_DS_MARKET}
  enabled: true
  max_tokens: 1500
  top_k: 5
output_fields:
- 客户背景
- 核心需求
- 市场分析
- 竞品情况
- 解决方案
- 客户价值
- 风险与建议
qa_version: v3
repair:
  enabled: true
  max_retries: 1
  min_delta: 0.2
  min_dimension_score: 3
  min_score: 3.8
steps:
- description: 任务分解与目标定义
  few_shot_from_cases: true
  few_shot_top_k: 2
  id: opc_leader
  lint_max_retries: 2
  name: OPC负责人
  sales_memory: true
  output_rules:
  - sections:
    - 信息状态清单
    - 客户画像
    - 核心需求
    - 客户等级
    - 关键风险
    - 预算与规模
    - 下游任务
    type: required_sections
  - chars: 300
    type: min_length
  - type: not_empty
  - type: no_refusal
  prompt_key: opc_leader
- description: 市场与竞品情报分析
  id: market_intel
  name: 市场情报专家
  output_rules:
  - type: not_empty
  - chars: 500
    type: min_length
  - type: number_consistency
  prompt_key: market_intel
  knowledge_scope:
  - battery_tech
  tools:
  - capabilities:
    - web_search
    - fetch_url
    server: web_search
  - capabilities:
    - ddg_search
    - ddg_news
    server: ddg_search
- description: 技术方案设计
  id: solution_architect
  name: 解决方案架构师
  output_rules:
  - type: not_empty
  - chars: 600
    type: min_length
  - type: number_consistency
  retry:
    max_retries: 1
    delay: 2.0
    retry_on:
    - linter_fail
  prompt_key: solution_architect
  knowledge_scope:
  - battery_tech
  - code_review_rules
- description: 客户价值表达转化
  id: customer_success
  name: 客户成功经理
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  prompt_key: customer_success
- id: conflict_resolver
  name: 冲突仲裁专家
  description: 数值对账表 + 文本冲突检测，输出统一立场
  prompt_key: opc_conflict
  prompt_module: src.prompts_qa_domain
  output_rules:
  - type: min_length
    chars: 400
  - type: not_empty
- description: QA质量检查与综合输出
  id: qa_tech_support
  name: 技术支持专家
  prompt_key: opc_qa
  prompt_module: src.prompts_qa_domain
