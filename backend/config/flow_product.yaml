flow_name: 产品部产品规划流程
# v3.0 InsightBee 升级：competitive_research → 4路并行(web_crawler+patent_analyzer+price_tracker+trend_analyzer) + insight_merger
max_llm_calls: 90
knowledge_pre_retrieval:
  enabled: true
  top_k: 3
  max_tokens: 1500
  dataset_ids: ${RAGFLOW_DS_INDUSTRY},${RAGFLOW_DS_PRODUCT}
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: product_manager
  name: 产品部门经理
  description: 战略研判与工作指令下达（史馆历史案例优先检索）
  prompt_key: product_manager
  prompt_module: src.prompts_product
  knowledge_scope:
  - shiguan_annals
  - 购销合同
# ── InsightBee 第一层：4路并行情报采集 ──────────────────
- id: web_crawler
  name: InsightBee·网络情报猎手
  description: 并行采集竞品动态、市场新闻、产品发布信息
  prompt_key: insightbee_web_crawler
  prompt_module: src.prompts_product
  depends_on:
  - product_manager
  knowledge_scope:
  - battery_tech
  tools:
  - capabilities:
    - web_search
    - fetch_url
    server: web_search
  - capabilities:
    - ddg_search
    server: ddg_search

- id: patent_analyzer
  name: InsightBee·专利图谱分析师
  description: 并行分析竞争对手专利布局与技术壁垒
  prompt_key: insightbee_patent_analyzer
  prompt_module: src.prompts_product
  depends_on:
  - product_manager
  knowledge_scope:
  - battery_tech
  tools:
  - capabilities:
    - web_search
    server: web_search

- id: price_tracker
  name: InsightBee·价格追踪专员
  description: 并行追踪竞品报价+历史成交合同，知识库含真实购销合同数据
  prompt_key: insightbee_price_tracker
  prompt_module: src.prompts_product
  depends_on:
  - product_manager
  knowledge_scope:
  - 购销合同
  tools:
  - capabilities:
    - web_search
    - fetch_url
    server: web_search
  - capabilities:
    - ddg_search
    server: ddg_search

- id: trend_analyzer
  name: InsightBee·趋势侦察专员
  description: 并行检测市场趋势、客户需求演变、监管动向
  prompt_key: insightbee_trend_analyzer
  prompt_module: src.prompts_product
  depends_on:
  - product_manager
  knowledge_scope:
  - battery_tech
  tools:
  - capabilities:
    - web_search
    server: web_search

# ── InsightBee 第二层：汇总 fan-in ────────────────────────
- id: insight_merger
  name: InsightBee·洞察汇总专家
  description: 汇总4路并行情报，输出结构化竞品分析报告
  prompt_key: insightbee_merger
  prompt_module: src.prompts_product
  depends_on:
  - web_crawler
  - patent_analyzer
  - price_tracker
  - trend_analyzer
  knowledge_scope:
  - battery_tech
  - 购销合同
  output_rules:
  - type: min_length
    chars: 600
  - type: not_empty

# ── 原有下游链路（依赖 insight_merger）──────────────────────
- id: product_planning
  name: 产品规划专员
  description: PRD编写与产品落地规划
  prompt_key: product_planning
  prompt_module: src.prompts_product
  depends_on:
  - insight_merger

- id: compliance_check
  name: 合规评估专员
  description: 合规风险评估与认证规划
  prompt_key: compliance_check
  prompt_module: src.prompts_product
  depends_on:
  - product_planning

- id: conflict_resolver
  name: 冲突仲裁专家
  description: 数值对账表 + 文本冲突检测，输出统一产品立场
  prompt_key: conflict_resolver_product
  prompt_module: src.prompts_product
  depends_on:
  - compliance_check
  output_rules:
  - type: min_length
    chars: 400
  - type: not_empty

- id: qa_tech_support
  name: 产品QA专家
  description: 产品域专属QA，追加C6 BOM链路核查 / C7 合规时间线可行性
  prompt_key: product_qa
  prompt_module: src.prompts_product
  depends_on:
  - conflict_resolver
repair:
  enabled: true
  max_retries: 1
  min_score: 3.5
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 机会评估
- 竞品分析
- 产品定义
- 技术规格
- 成本定价
- 开发计划
- 合规路径
