# 朝堂治理角色白名单 — 谁能当御史(放行/拦截升阶的把关人)。
# 修洞B:注册默认 role=user,无人能放行。这里登记的用户名 → 授御史(yushi)权。
#
# schneier 红线:授御史是权限升级,只能由能改本配置/部署的人授(留 git 痕可审计),
# 绝不开"自助领取"。运行时 admin 授权口是 v2,先用本白名单硬控。
#
# 用法:把该当御史的用户名填进 yushi 列表,部署即生效。空 = 暂无人可放行(安全默认)。

yushi: []          # 例:["shenpanzhang", "compliance_lead"]
harness: []        # 自动化把关(release_gate/CI)用的系统账号,如有
