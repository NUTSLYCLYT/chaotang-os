flow_name: 礼部品牌战略蜂群
qa_domain: general  # 非产品蜂群:豁免产品语义硬核查,QA走 prompts_brand_strategy 领域化审查
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
max_llm_calls: 60
knowledge_pre_retrieval:
  enabled: true
  top_k: 4
  max_tokens: 2000
repair:
  enabled: true
  critic_before_repair: true
  max_retries: 1
  min_score: 3.8
output_fields:
- 核心价值主张
- 品牌调性守则
- 价值观编码表
- 雇主品牌叙事线
- 文字调性一致性守则
- 品牌手册摘要
- 完整规则清单
steps:
- id: brand_positioning_strategist
  name: 品牌定位战略专家
  prompt_key: brand_positioning_strategist
  prompt_module: src.prompts_brand_strategy
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["核心价值主张", "目标受众画像", "品牌调性守则", "差异化叙事角度"]
    type: required_sections
- id: corporate_culture_narrator
  name: 企业文化对外叙事专家
  depends_on: [brand_positioning_strategist]
  prompt_key: corporate_culture_narrator
  prompt_module: src.prompts_brand_strategy
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["价值观编码表", "雇主品牌叙事线", "企业形象故事素材", "安全边界(防止人格劫持)"]
    type: required_sections
- id: visual_identity_reviewer
  name: 视觉识别一致性守则专家
  depends_on: [brand_positioning_strategist]
  prompt_key: visual_identity_reviewer
  prompt_module: src.prompts_brand_strategy
  output_rules:
  - type: not_empty
  - chars: 300
    type: min_length
  - type: no_refusal
  - sections: ["文字调性一致性守则", "排版与格式规范", "跨平台适配原则"]
    type: required_sections
- id: brand_asset_compiler
  name: 品牌资产手册汇总专家
  depends_on: [corporate_culture_narrator, visual_identity_reviewer]
  prompt_key: brand_asset_compiler
  prompt_module: src.prompts_brand_strategy
  output_rules:
  - type: not_empty
  - chars: 400
    type: min_length
  - type: no_refusal
  - sections: ["品牌手册摘要", "完整规则清单", "待人工确认项"]
    type: required_sections
- id: qa_tech_support
  name: 技术支持专家(QA)
  depends_on: [brand_asset_compiler]
  prompt_key: brand_strategy_qa
  prompt_module: src.prompts_brand_strategy
