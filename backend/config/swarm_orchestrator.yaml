    qa_version: "v3"

  - id: "hardware_design"
    name: "工部硬件设计蜂群"
    config: "config/flow_hardware_design.yaml"
    qa_version: "v3"

  - id: "process_manufacturing"
    name: "工部工艺生产蜂群"
    config: "config/flow_process_manufacturing.yaml"
    qa_version: "v3"

  - id: "finance"
    name: "财务分析流程"
    config: "config/flow_finance.yaml"
    qa_version: "v3"

  - id: "legal"
    name: "法律合规流程"
    config: "config/flow_legal.yaml"
    qa_version: "v3"

  - id: "jinyiwei"
    name: "锦衣卫情报蜂群"
    config: "config/flow_jinyiwei.yaml"
    qa_version: "v3"

  - id: "tianjian"
    name: "钦天监预测参谋蜂群"
    config: "config/flow_tianjian.yaml"
    qa_version: "v3"

  - id: "libu_personnel"
    # 2026-07-04 由 "libu" 改名:harness/chaotang_department_protocol/departments.yaml、
    # court_doc_builder.py 等5+文件里 "libu" 已经是礼部的意思,和这里(吏部)撞名,
    # 改用那边已经在用的 "libu_personnel" 消歧,不动多数派的礼部含义。
    name: "吏部人才蜂群"
    config: "config/flow_libu.yaml"
    qa_version: "v3"

  - id: "lipu"
    name: "礼部出版蜂群"
    config: "config/flow_lipu.yaml"
    qa_version: "v3"

  - id: "brand_strategy"
    name: "礼部品牌战略蜂群"
    config: "config/flow_brand_strategy.yaml"
    qa_version: "v3"

  - id: "xiaohongshu"
    name: "小红书运营流程"
    config: "config/flow_xiaohongshu.yaml"
    qa_version: "v3"

  - id: "court"
    name: "三省六部朝堂治理流"
    config: "config/flow_court.yaml"
    qa_version: "v3"

  - id: "battery_stage_gate"
    name: "电池研发 Stage Gate 决策蜂群"
    config: "config/flow_battery_stage_gate.yaml"
