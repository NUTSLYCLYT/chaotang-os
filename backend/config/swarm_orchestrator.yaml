# ── 冲突仲裁 ─────────────────────────────────────────
# 当同一事件触发多个下游蜂群、或同一蜂群被多源触发时的决策策略
#
# strategy 说明:
#   "all"        — 默认，所有绑定依次执行（当前行为，兼容模式）
#   "first_win"  — 同一 target_swarm 被多个事件触发时，只接受第一个
#   "best_score" — 同一 topic 多个下游，按上游评分排序执行
arbitration:
  strategy: "all"

# ── 并行执行配置 ──────────────────────────────────────
execution:
  # 事件触发的下游蜂群并发数（1 = 串行，>1 = 并行）
  # 例：opc_completed 同时触发 product + ima 时，设为 2 可并发执行
  parallel_workers: 3

  # parallel_entry: 多入口并行（同时启动多个蜂群，无需等待事件触发）
  # 取消注释并配置后，swarm-run 会同时启动这些蜂群
  # parallel_entry:
  #   - opc
  #   - haolong

# ── 事件绑定 ─────────────────────────────────────────
# 当 topic 事件触发时，自动启动 target_swarm
#
# transform 说明:
#   "auto"        — 将上游 final_output 各字段拼成结构化文本作为下游输入
#   "passthrough" — 直接透传原始 task_input
#   "<field_key>" — 从上游 final_output 提取指定字段
#
# min_quality_score: 质量门控（0 = 不限制）

bindings:
  # 获客完成 → 触发 OPC 方案流程
  - topic: "haolong_completed"
    target_swarm: "opc"
    transform: "auto"
    min_quality_score: 3.5      # T3: 低质量线索不自动触发昂贵的 OPC 方案流程(防垃圾下游流转)
    enabled: true

  # OPC 方案完成 → 触发产品部规划
  - topic: "opc_completed"
    target_swarm: "product"
    transform: "auto"
    min_quality_score: 3.5      # T3: 低分方案不自动触发产品规划(方略§5,数据链路质门补真阈值)
    enabled: true

  # 产品部规划完成 → 触发报价单生成
  - topic: "product_completed"
    target_swarm: "quotation"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # OPC 方案完成（高质量）→ 触发 IMA 知识归档
  - topic: "opc_completed"
    target_swarm: "ima"
    transform: "auto"
    min_quality_score: 4.0   # 只有高质量方案才值得归档
    enabled: true

  # 产品部规划完成（高质量）→ 触发 IMA 知识归档
  - topic: "product_completed"
    target_swarm: "ima"
    transform: "auto"
    min_quality_score: 4.0
    enabled: true

  # PACK研发完成（质量达标）→ 触发 Stage Gate 决策评审
  - topic: "pack_rd_completed"
    target_swarm: "battery_stage_gate"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # 产品部规划完成（质量达标）→ 触发电芯Sourcing搜寻
  - topic: "product_completed"
    target_swarm: "sourcing"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # 产品部规划完成（质量达标）→ 史馆归档（产品决策 + InsightBee情报 + 合规路径存档）
  - topic: "product_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 3.0   # 低于IMA门槛，确保大多数产品规划都能归档
    enabled: true

  # 报价完成（高质量）→ 归档进知识库（销售学习闭环:成交报价沉淀,喂回未来报价检索）
  - topic: "quotation_completed"
    target_swarm: "ima"
    transform: "auto"
    min_quality_score: 4.0
    enabled: true

  # ── 史馆归档绑定 ── 质量达标的产出沉淀为可检索的历史案例 ──────────
  # 报价单完成（中高质量）→ 史馆归档（成交报价 + 决策依据）
  - topic: "quotation_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # PACK研发完成（质量达标）→ 史馆归档（研发决策 + BOM + 风险记录）
  - topic: "pack_rd_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # 售后诊断完成（质量达标）→ 史馆归档（现场案例 + 处置经验）
  - topic: "storage_aftercare_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 3.5
    enabled: true

  # Stage Gate 决策完成（任何质量）→ 史馆归档（不可逆决策必须存档）
  - topic: "battery_stage_gate_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 0
    enabled: true

  # OPC 方案完成（高质量）→ 史馆归档（市场方案 + 客户洞察）
  - topic: "opc_completed"
    target_swarm: "shiguan_archive"
    transform: "auto"
    min_quality_score: 4.0
    enabled: true

  # ── 工部代码审查绑定（任正非"强制入口"）──────────────────────
  # SDLC 完成 → 工部审查（代码生成后必须经工部验收）
  - topic: "sdlc_completed"
    target_swarm: "gongbu_review"
    transform: "auto"
    min_quality_score: 0        # 无论质量高低都必须过工部
    enabled: true

# ── 预定义事件主题 ───────────────────────────────────
# 约定：每个蜂群完成后自动发布 "{swarm_id}_completed" 事件
# 失败时发布 "{swarm_id}_failed" 事件
#
# 事件主题列表（供参考，无需手动配置）:
#   haolong_completed   — 获客Pipeline完成
#   haolong_failed      — 获客Pipeline失败
#   opc_completed       — OPC方案流程完成
#   opc_failed          — OPC方案流程失败
#   product_completed   — 产品部规划完成
#   product_failed      — 产品部规划失败
#   quotation_completed — 报价单生成完成
#   quotation_failed    — 报价单生成失败
#   sourcing_completed  — 电芯Sourcing搜寻完成
#   sourcing_failed     — 电芯Sourcing搜寻失败
