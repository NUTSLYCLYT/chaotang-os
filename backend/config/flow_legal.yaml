flow_name: 法律与合同风险评估流程
qa_domain: general  # 非产品蜂群:豁免 C2需求约束/C3规格实测 产品语义硬核查,只强制 C1 数字勾稽
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: legal_review
  name: 法务初审专员
  description: 识别法律问题边界与适用法域
  prompt_key: legal_review
- id: contract_counsel
  name: 合同法务专员
  description: 审阅合同文本并输出关键条款清单
  prompt_key: contract_counsel
- id: legal_compliance
  name: 合规与落地专员
  description: 核查监管、内控和取证链路，输出落地要求
  prompt_key: legal_compliance
- id: qa_tech_support
  name: 质量检查专家
  description: QA质量检查与综合输出
  prompt_key: legal_qa
  prompt_module: src.prompts_qa_domain
repair:
  enabled: true
  max_retries: 1
  min_score: 3.8
  min_delta: 0.2
  min_dimension_score: 3.0
output_fields:
- 合同背景与适用法域
- 风险识别清单
- 核心条款建议
- 合规审查结论
- 争议与执行方案
- 法务决策建议

knowledge_pre_retrieval:
  enabled: true
  top_k: 5
  max_tokens: 2000
