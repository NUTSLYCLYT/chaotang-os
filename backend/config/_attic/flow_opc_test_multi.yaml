# 多模型测试 flow：原版用占位符（model-a / model-b / model-default）做静态校验。
# 切换到 active=bailian 后这些占位符无法解析，已改为依赖 active provider 注入。
# 如需做"step 间用不同模型"的真实测试，恢复 model 字段并填真实 provider model 名即可。
default_api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
default_api_key_env: DASHSCOPE_API_KEY
default_model: openai/qwen-plus
flow_name: OPC市场方案流程 - 多模型测试
qa_version: "v3"
output_fields:
- 客户背景
- 核心需求
- 市场分析
- 竞品情况
- 解决方案
- 客户价值
- 风险与建议
steps:
- description: 任务分解与目标定义
  id: opc_leader
  name: OPC负责人
  prompt_key: opc_leader
- description: 市场与竞品情报分析
  id: market_intel
  name: 市场情报专家
  prompt_key: market_intel
- description: 技术方案设计
  id: solution_architect
  name: 解决方案架构师
  prompt_key: solution_architect
- description: 客户价值表达转化
  id: customer_success
  name: 客户成功经理
  prompt_key: customer_success
- description: QA质量检查与综合输出
  id: qa_tech_support
  name: 技术支持专家
  prompt_key: qa_tech_support
