## OPC方案流程 × DeepSeek-Reasoner 对比测试版
## 目的：用 R1 推理链替换 swarm-quick，对比 QA 评分变化
## 去掉 knowledge_pre_retrieval（RAGFlow 需外部服务），保留 knowledge_inject（本地文件）
## 3 个核心步骤 + QA，覆盖最关键的"分析→方案→评估"链路

default_api_base: https://api.deepseek.com/v1
default_api_key_env: DEEPSEEK_API_KEY
default_model: openai/deepseek-reasoner
default_retry:
  max_retries: 2
  delay: 3
  backoff: 2
  retry_on:
    - error

flow_name: OPC市场方案流程(R1推理版)
max_llm_calls: 30

knowledge_inject:
  file: knowledge/battery_prices.yaml
  max_tokens: 2000

output_fields:
  - 客户背景
  - 核心需求
  - 解决方案
  - 客户价值
  - 风险与建议

qa_version: v3

steps:
  - id: opc_leader
    name: OPC负责人
    description: 任务分解与目标定义
    prompt_key: opc_leader
    output_rules:
      - type: required_sections
        sections:
          - 客户画像
          - 核心需求
          - 关键风险
          - 下游任务
      - type: min_length
        chars: 300
      - type: not_empty
      - type: no_refusal

  - id: solution_architect
    name: 解决方案架构师
    description: 技术方案设计（R1 深度推理）
    prompt_key: solution_architect
    output_rules:
      - type: not_empty
      - type: min_length
        chars: 400
      - type: number_consistency

  - id: customer_success
    name: 客户成功经理
    description: 客户价值表达转化
    prompt_key: customer_success
    output_rules:
      - type: not_empty
      - type: min_length
        chars: 200

  - id: qa_tech_support
    name: QA评估
    description: QA质量检查与综合输出
    prompt_key: qa_tech_support
    # QA 步骤用轻量模型节省成本
    model: openai/deepseek-chat
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    tier: validation
