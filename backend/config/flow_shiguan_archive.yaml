flow_name: "史馆归档流程"
max_llm_calls: 40

# 知识预检索：查历史案例作归档参考（shiguan_annals 是史馆自身的归档回流）
knowledge_pre_retrieval:
  enabled: true
  scope:
    - "shiguan_annals"
    - "购销合同"
  top_k: 5

qa_version: "v3"

# 使用 providers.yaml active provider（本地 qwen2.5:14b 或 DeepSeek），不硬编码
default_model: "openai/swarm-worker"
default_api_base: "http://127.0.0.1:4444/v1"
default_api_key_env: "LITELLM_PROXY_KEY"

default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
    - error

steps:
  - id: "archive_extractor"
    name: "决策提炼官"
    description: "从已结案材料提炼结构化决策档案(议题/时间线/参与方/结论/依据)"
    prompt_key: "archive_extractor"
    prompt_module: "src.prompts_shiguan_archive"
    tier: "generation"

  - id: "lesson_distiller"
    name: "鉴往提炼师"
    description: "提炼成功经验/失败教训/风险预警(可执行、带触发条件)"
    prompt_key: "lesson_distiller"
    prompt_module: "src.prompts_shiguan_archive"
    tier: "generation"

  - id: "annals_writer"
    name: "史册撰写官"
    description: "撰写编年体史册条目(纪事+附议+史评)"
    prompt_key: "annals_writer"
    prompt_module: "src.prompts_shiguan_archive"
    tier: "generation"

  - id: "archive_indexer"
    name: "归档索引员"
    description: "生成检索标签/决策类型/风险等级/关联案例 + 归档自检"
    prompt_key: "archive_indexer"
    prompt_module: "src.prompts_shiguan_archive"
    tier: "generation"

  - id: "qa_tech_support"
    name: "质量检查专家"
    description: "QA 质量检查与综合输出"
    prompt_key: shiguan_archive_qa
    prompt_module: src.prompts_shiguan_archive
    tier: "validation"

repair:
  enabled: true
  max_retries: 1
  min_score: 3.5
  min_delta: 0.2
  min_dimension_score: 3.0

output_fields:
  - "决策档案"
  - "鉴往录"
  - "史册条目(编年体)"
  - "归档元数据"
  - "归档自检结论"
