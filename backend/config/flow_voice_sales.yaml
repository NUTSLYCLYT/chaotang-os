flow_name: 语音获客销售Flow
qa_version: v3
default_model: openai/swarm-worker
default_api_base: http://127.0.0.1:4444/v1
default_api_key_env: LITELLM_PROXY_KEY
flow_tools:
- server: crm
  capabilities:
  - search_customers
default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
  - error
steps:
- id: call_analyzer
  name: 来电意向分析师
  description: 识别来电意向、提取客户信息、生成回复话术
  prompt_key: call_analyzer
- id: lead_outreach
  name: 触达AI
  description: 判断加微信时机、生成触达策略与话术
  prompt_key: lead_outreach
  tools:
  - server: wechat_outreach
    capabilities:
    - add_wechat_contact
- id: lead_archive
  name: 归档AI
  description: 客户档案构建与线索归档
  prompt_key: lead_archive
  # 客户档案卡9字段契约(2026-07-07 与 flow_haolong.yaml 的同名步骤保持一致,
  # 两个flow共用同一份 PROMPT_LEAD_ARCHIVE,字段列表必须同步改)。
  output_rules:
  - type: required_fields
    fields:
    - 客户名称
    - 客户类型
    - 行业
    - 地域
    - 需求摘要
    - 商机评级
    - 预算范围
    - 紧迫程度
    - 决策链
repair:
  enabled: false
  max_retries: 2
  min_score: 3.5
output_fields:
- 意向度
- 客户信息
- 回复话术
- 触达策略
- 加微信建议
- 客户档案
