harness: chaotang_business_model
version: 1

market_context:
  updated_at: "2026-06-07"
  references:
    - name: OpenAI ChatGPT Pricing
      url: https://openai.com/chatgpt/pricing
      note: Individual, team/business, and enterprise tiers validate tiered subscription packaging.
    - name: Claude Pricing
      url: https://claude.com/pricing
      note: Team and Enterprise plans validate governance and capacity packaging.
    - name: Midjourney Plans
      url: https://docs.midjourney.com/hc/en-us/articles/27870484040333-Comparing-Midjourney-Plans
      note: Creative AI plans validate usage/capacity tiers around generation workload.
    - name: BVP AI Pricing Playbook 2026
      url: https://www.bvp.com/assets/uploads/2026/02/The_AI_pricing_playbook_for_founders_Bessemer_Venture_Partners_2026.pdf
      note: Agents should move toward workflow or outcome-aligned pricing when ROI is tangible.

pricing_principles:
  - Subscriptions create predictable baseline cash flow.
  - Chaobi captures variable high-intensity usage without punishing light users.
  - Enterprise annual contracts fund support, governance, security, and custom deployment.
  - Marketplace revenue grows after user workflows and agent styles prove repeat demand.
  - Honor progression is earned only by verified work; paid credits buy capability, not status.

segments:
  free:
    label: 免费
    monthly_cny: 0
    target: curious_beginner
    included_chaobi: 0
    seats_min: 1
    value: Try first task, basic battle report, no long-term memory.
  pro:
    label: 主君 Pro
    monthly_cny: 128
    target: beginner_power_user
    included_chaobi: 300
    seats_min: 1
    value: Core departments, Shiguan memory, title progression, starter Chaobi.
  max:
    label: 圣裁 Max
    monthly_cny: 498
    target: advanced_player_builder
    included_chaobi: 1600
    seats_min: 1
    value: Stronger models, deeper Yushi review, red-team starter, more automation.
  ultra:
    label: 天命 Ultra
    monthly_cny: 1288
    target: heavy_operator_geek
    included_chaobi: 5200
    seats_min: 1
    value: Long tasks, premium advisor agents, Jinyiwei scouting, elite battle reports.
  team:
    label: Team
    monthly_cny: 299
    billing_unit: seat
    seats_min: 5
    included_chaobi: 900
    target: small_team
    value: Shared Shiguan, team permissions, department ownership, pooled reports.
  business:
    label: Business
    monthly_cny: 699
    billing_unit: seat
    seats_min: 10
    included_chaobi: 2500
    target: operating_team
    value: Audit, budget, workflow governance, company knowledge, finance reporting.
  enterprise:
    label: Enterprise
    annual_cny: 198000
    seats_min: 20
    included_chaobi: 120000
    target: regulated_company
    value: SSO, private deployment option, audit, budget caps, custom agents, SLA.

