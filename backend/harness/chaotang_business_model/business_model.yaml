forbidden_monetization:
  - user_title
  - task_score
  - yushi_approval
  - leaderboard_rank
  - verified_roi
  - forged_archive
  - cash_withdrawal
  - external_transfer
  - paid_random_loot

delight_rules:
  minimum_visible_feedback: 1
  must_include_next_action: true
  must_not_use_shame_or_fomo: true
  must_show_value_metric: true
  forbidden_triggers:
    - fake_countdown
    - shame_streak_loss
    - forced_popup
    - hidden_fee
    - pay_to_pass_gate

investor_story:
  headline: "AI 朝堂 OS：把 AI 从答案工具升级为可信执行、审查、记忆和成长系统。"
  must_have_sections:
    - market_pain
    - product_magic
    - business_loop
    - pricing_ladder
    - moat
    - proof_metrics
    - compliance_boundary
    - cash_flow_plan
  proof_metrics:
    - first_task_success_rate
    - weekly_repeat_runs
    - paid_conversion_rate
    - chaobi_consumption_per_paid_user
    - yushi_risk_blocks
    - shiguan_reuse_rate
    - team_expansion_rate
    - enterprise_pipeline_value

