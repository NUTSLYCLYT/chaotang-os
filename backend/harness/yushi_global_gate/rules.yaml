version: 1
levels:
  green: 0
  yellow: 1
  red: 2
  black: 3
automation_levels:
  L0: read_only
  L1: draft
  L2: internal_task
  L3: tool_with_human_confirm
  L4: low_risk_auto_execute
  L5: irreversible_or_external_commitment
high_stakes_terms:
  - 上线
  - 生产
  - 客户承诺
  - 报价
  - 合同
  - 交付
  - 删除
  - 花钱
  - 自动执行
  - 不可逆
experience_drift_terms:
  - 体验实现
  - 呈现层改动
  - 体验模块
  - 体验线
number_claim_terms:
  - 元
  - 万
  - MWh
  - GWh
  - ROI
  - 收益
  - 成本
  - 报价
  - "% "
risk_rules:
  dependency_security:
    red_statuses:
      - poc_needs_review
      - poc_failed
      - version_failed
      - missing_tool
    yellow_statuses:
      - poc_blocked_missing_env
      - ready_missing_env
    max_severity_red: 7.0
    max_severity_black: 9.5
  customer_commitment:
    red_without_human_signoff: true
  automation:
    black_without_qintianjian_at_or_above: L4
  experience_drift:
    red_if_present: true
  ungrounded_numbers:
    yellow_without_evidence: true
    red_if_high_stakes: true
