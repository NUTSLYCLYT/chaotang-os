flow_name: "锦衣卫情报蜂群"
max_llm_calls: 40

# 由 new_swarm.py 生成的骨架。提示词在 src/prompts_jinyiwei_intel.py 精修。
knowledge_pre_retrieval:
  enabled: false

qa_version: "v3"

default_model: "openai/glm-5.1"
default_api_base: "http://127.0.0.1:4000/v1"
default_api_key_env: "LITELLM_PROXY_KEY"

default_retry:
  max_retries: 2
  delay: 3.0
  backoff: 2.0
  retry_on:
    - error

steps:
  - id: "intel_tasker"
    name: "情报调度官"
    description: "把情报需求拆成检索任务关键词来源时间窗"
    prompt_key: "intel_tasker"
    prompt_module: "src.prompts_jinyiwei_intel"
    tier: "generation"
  - id: "source_collector"
    name: "信源采集官"
    description: "整理采集到的信源并标注出处时效"
    prompt_key: "source_collector"
    prompt_module: "src.prompts_jinyiwei_intel"
    tier: "generation"
  - id: "intel_analyst"
    name: "情报研判官"
    description: "交叉验证去伪存真研判可信度"
    prompt_key: "intel_analyst"
    prompt_module: "src.prompts_jinyiwei_intel"
    tier: "generation"
  - id: "intel_reporter"
    name: "情报奏报官"
    description: "出带来源标注的情报简报"
    prompt_key: "intel_reporter"
    prompt_module: "src.prompts_jinyiwei_intel"
    tier: "generation"
  - id: "qa_tech_support"
    name: "质量检查专家"
    description: "QA 质量检查与综合输出"
    prompt_key: "qa_tech_support"
    tier: "validation"

repair:
  enabled: false
  max_retries: 3
  min_score: 3.5
  min_delta: 0.2
  min_dimension_score: 3.0

output_fields:
  - "情报调度官产出"
  - "信源采集官产出"
  - "情报研判官产出"
  - "情报奏报官产出"

