[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jiqun-flow"
version = "0.1.0"
description = "LLM-native multi-agent swarm engine for battery PACK design automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["battery", "PACK", "LLM", "multi-agent", "design-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "litellm>=1.83.10",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.5",
]

[project.optional-dependencies]
knowledge = ["sentence-transformers>=3.0"]
web = ["fastapi>=0.111", "uvicorn>=0.29"]
all = ["jiqun-flow[knowledge,web]"]

[project.scripts]
jiqun-run = "scripts.run_flow:main"
jiqun-report = "scripts.export_report:main"
jiqun-flywheel = "scripts.flywheel_stats:main"

[project.urls]
Repository = "https://github.com/your-org/jiqun-flow"
Documentation = "https://jiqun-flow.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", "runs", "events", "swarm_sessions", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "B",   # flake8-bugbear (likely bugs)
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (common in Flask)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]          # test files: allow unused imports and redefinitions
"web/app.py" = ["E402"]               # allow module-level imports not at top
"src/flow_engine.py" = ["E402"]       # src imports after logger init
"src/auth_middleware.py" = ["E402"]   # conditional imports
"src/tenant.py" = ["E402"]            # conditional imports
