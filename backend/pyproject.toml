[project]
name = "chaotang-os-backend"
version = "0.1.0"
description = "chaotang-os backend service foundation: a minimal FastAPI app exposing GET /health only. No business logic, no persistence, no agent runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=1.2,<2",
    "openai>=1.40,<2",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
