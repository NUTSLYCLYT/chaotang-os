id: xingbu_complexity_profiles_v1
department_id: justice
purpose: >
  刑部按公司规模、管理成熟度、问题风险和用户偏好自适应运行深度。
  自适应只调整披露表面（mode、默认展示深度、默认启用子司、是否暴露子司结构），
  不调整风险地板。高风险升维、source_label、证据/缺口、人工确认和不可逆动作拦截永远生效。
  本配置不创建多套刑部流程，仍复用 xingbu_clo_cco_office_loop_v1 与 court_unified_decision_loop_v1。

modes:
  - mode: founder_legal_safety
    headcountBand: "1-10"
    display_name: 老板法律安全模式
    defaultView: brief
    exposeSubOfficeStructure: false
    enabledSubOffices: [clo_cco_chief]
    lightweightSubOffices: [contract_office, legal_operations]
    high_risk_extra_offices: [employment_law, corporate_governance, dispute_litigation, ip_confidentiality, compliance]
    supported_scenarios: [合同能不能签, 客户承诺能不能说, 员工能不能辞退, 报价是否构成承诺, 印章风险, 付款风险, 股权风险]

  - mode: small_team_legal_manager
    headcountBand: "10-50"
    display_name: 小团队法务经理模式
    defaultView: management_detail
    exposeSubOfficeStructure: false
    enabledSubOffices: [clo_cco_chief, contract_office, employment_law, legal_operations]
    lightweightSubOffices: [corporate_governance, compliance]
    high_risk_extra_offices: [dispute_litigation, ip_confidentiality]
    supported_scenarios: [合同, 付款, 劳动风险, 客户承诺, 股权, 基础合规]

  - mode: growth_legal_compliance
    headcountBand: "50-200"
    display_name: 成长型法务/合规模式
    defaultView: management_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [clo_cco_chief, contract_office, corporate_governance, compliance, dispute_litigation, employment_law, ip_confidentiality, legal_operations]
    supported_scenarios: [合同台账, 审批权限, 劳动争议, 知识产权, 合规制度, 外部律师协同]

  - mode: clo_cco
    headcountBand: "200-1000"
    display_name: 中型企业 CLO/CCO 模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [clo_cco_chief, contract_office, corporate_governance, compliance, dispute_litigation, employment_law, ip_confidentiality, legal_operations]
    supported_scenarios: [合同生命周期, 法务运营, 诉讼管理, 公司治理, 合规体系, 知识产权体系]

  - mode: group_legal_ops
    headcountBand: "1000+"
    display_name: 集团法务模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [clo_cco_chief, contract_office, corporate_governance, compliance, dispute_litigation, employment_law, ip_confidentiality, legal_operations]
    reservedCapabilities: [Legal_Ops, Compliance_Program, Litigation_Portfolio, Data_Privacy, International_Trade, AI_Governance]
    note: 当前只预留架构，不实现完整集团能力。
    supported_scenarios: [集团法务运营, 合规项目, 诉讼组合管理, 数据隐私预留, 国际贸易预留, AI治理预留]

escalation_rules:
  - id: contract_signing_always_escalate
    when: [合同签署, 合作协议, 签约, 签合同]
    always_involve: [contract_office, legal_operations]
    human_confirmation: true
  - id: external_commitment_always_escalate
    when: [对外承诺, 正式报价, 客户确认函, 承诺收益, 保证收益]
    always_involve: [contract_office, compliance]
    cross_review: [war, finance]
    human_confirmation: true
  - id: equity_or_governance_always_escalate
    when: [股权, 分红, 对赌, 投融资, 合伙人退出, 董事会, 章程]
    always_involve: [corporate_governance, clo_cco_chief]
    human_confirmation: true
  - id: payment_penalty_or_guarantee_involve_hubu
    when: [付款, 预付款, 退款, 保证金, 违约金, 担保]
    always_involve: [contract_office, finance]
    human_confirmation: true
  - id: labor_action_involve_libu
    when: [辞退, 解除, 处分, 降薪, 调岗, 竞业, 劳动仲裁]
    always_involve: [employment_law, personnel]
    human_confirmation: true
  - id: dispute_or_lawyer_letter_involve_dispute_office
    when: [律师函, 诉讼, 仲裁, 索赔, 催收, 拖欠付款]
    always_involve: [dispute_litigation]
    human_confirmation: true
  - id: ip_or_confidentiality_involve_ip_office
    when: [商标, 版权, 著作权, 专利, 商业秘密, NDA, 保密, 知识产权]
    always_involve: [ip_confidentiality]
  - id: seal_or_signature_involve_legal_ops
    when: [印章, 盖章, 签字, 签署权限, 授权代表]
    always_involve: [legal_operations]
    human_confirmation: true
  - id: compliance_or_license_involve_compliance_office
    when: [合规, 监管, 牌照, 行业许可, 政策, 反商业贿赂]
    always_involve: [compliance]
  - id: ai_generated_external_content_involve_junjichu_and_xingbu
    when: [AI agent, AI Agent, 蜂群, 自动生成, 客户邮件, 对外材料]
    always_involve: [junjichu, justice, jinyiwei]
    human_confirmation: true
  - id: privacy_sensitive_data_requires_permission_guard
    when: [个人信息, 员工, 薪酬, 客户资料, 供应商资料, 诉讼材料, 商业秘密]
    always_apply: privacy_sensitive_data_guard

user_choices:
  - brief
  - management_detail
  - professional_detail
  - enter_junjichu_deep_review
  - generate_artifact
  - request_department_review

non_negotiable_floor:
  - high_risk_requires_human_confirmation
  - contract_or_commitment_review
  - equity_or_governance_review
  - labor_risk_review
  - source_label_required
  - evidence_or_gap_required
  - privacy_sensitive_data_guard
  - no_irreversible_legal_action_without_approval
