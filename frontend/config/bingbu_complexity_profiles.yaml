id: bingbu_complexity_profiles_v1
department_id: war
purpose: >
  兵部按公司规模、销售成熟度、问题风险和用户偏好自适应运行深度。
  自适应只调整默认展示深度、默认启用子司和是否暴露专业结构；
  不调整高风险人工确认、户部/刑部/礼部/锦衣卫复核、source_label、证据/缺口和禁止自动外发底线。
  本配置不创建多套兵部流程，仍复用 bingbu_cro_sales_office_loop_v1 与 court_unified_decision_loop_v1。

modes:
  - mode: founder_sales_assistant
    headcountBand: "1-10"
    display_name: 老板销售推进助手模式
    defaultView: brief
    exposeSubOfficeStructure: false
    enabledSubOffices: [cro_chief]
    lightweightSubOffices: [opportunity_pipeline, key_account_attack, pricing_deal_desk]
    high_risk_extra_offices: [pricing_deal_desk, sales_revops]
    supported_scenarios: [要不要跟, 下一步怎么跟, 客户怎么回复, 要不要报价, 简单销售话术]

  - mode: small_team_sales_manager
    headcountBand: "10-50"
    display_name: 小团队销售经理模式
    defaultView: brief
    exposeSubOfficeStructure: false
    enabledSubOffices: [cro_chief, opportunity_pipeline, key_account_attack, pricing_deal_desk]
    lightweightSubOffices: [gtm_strategy, channel_partner, sales_revops, customer_success_growth]
    high_risk_extra_offices: [pricing_deal_desk, sales_revops, channel_partner]
    supported_scenarios: [客户推进, 商机阶段, 报价策略, 跟进节奏, 简单 pipeline]

  - mode: growth_sales_engine
    headcountBand: "50-200"
    display_name: 成长型销售组织模式
    defaultView: management_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [cro_chief, gtm_strategy, opportunity_pipeline, key_account_attack, pricing_deal_desk, channel_partner, sales_revops, customer_success_growth]
    supported_scenarios: [GTM, pipeline, 重点客户, 报价, 渠道, forecast, 复购]

  - mode: cro_revops
    headcountBand: "200-1000"
    display_name: CRO / RevOps 模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [cro_chief, gtm_strategy, opportunity_pipeline, key_account_attack, pricing_deal_desk, channel_partner, sales_revops, customer_success_growth]
    supported_scenarios: [销售预测, 销售节奏, 渠道体系, deal desk, 客户成功, Revenue Operations, 专业分奏]

  - mode: enterprise_revenue_governance
    headcountBand: "1000+"
    display_name: 集团收入治理模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [cro_chief, gtm_strategy, opportunity_pipeline, key_account_attack, pricing_deal_desk, channel_partner, sales_revops, customer_success_growth]
    reservedCapabilities: [Regional_Sales, Industry_Sales, RevOps_Data_Governance, Sales_Enablement, Global_Channel, AI_Sales_Governance]
    note: 当前只预留区域销售、行业销售、RevOps 数据治理、销售赋能、全球渠道、AI Sales Governance 架构，不实现完整集团能力。
    supported_scenarios: [集团收入治理, 多区域销售路线, 销售数据治理, 全球渠道预留, AI Sales Governance 预留]

escalation_rules:
  - id: formal_quote_always_involve_hubu_and_xingbu
    when: [正式报价, 报价单, 发报价, 客户要报价, quote]
    always_involve: [pricing_deal_desk, finance, justice]
    required_gate: formal_quote_requires_hubu_and_xingbu_review
    human_confirmation: true
  - id: discount_or_margin_boundary_always_involve_hubu
    when: [折扣, 八折, 底价, 毛利, 价格边界, 压价]
    always_involve: [pricing_deal_desk, finance]
    required_gate: discount_requires_margin_boundary
  - id: roi_or_revenue_claim_always_involve_hubu_and_rites_and_xingbu
    when: [ROI, 收益, 回报, 回本, revenue claim, 增收承诺]
    always_involve: [pricing_deal_desk, finance, ritual, justice]
    required_gate: roi_or_revenue_claim_requires_hubu_review
    human_confirmation: true
  - id: legal_contract_exclusivity_or_payment_always_involve_xingbu
    when: [合同, 框架协议, 独家, 排他, 付款, 违约, 协议]
    always_involve: [pricing_deal_desk, channel_partner, justice]
    required_gate: external_commitment_requires_xingbu_review
    human_confirmation: true
  - id: customer_commitment_always_involve_jinyiwei_and_xingbu
    when: [客户承诺, 客户确认, 客户预算, 采购意向, 口头承诺]
    always_involve: [opportunity_pipeline, key_account_attack, jinyiwei, justice]
    required_gate: customer_claims_require_source
  - id: competitor_claim_always_involve_jinyiwei_and_rites_and_xingbu
    when: [竞品, 竞品更便宜, 竞品对比, 竞品攻击, 市场排名, 行业第一]
    always_involve: [gtm_strategy, pricing_deal_desk, jinyiwei, ritual, justice]
    required_gate: competitor_claims_require_jinyiwei_evidence
  - id: delivery_or_capability_claim_requires_relevant_department_or_capability_gap
    when: [交期, 交付能力, 技术能力, 能力承诺, 产能]
    always_involve: [customer_success_growth, works]
    required_gate: no_price_or_delivery_commitment_without_review
  - id: sales_compensation_always_involve_libu_and_hubu
    when: [销售提成, 提成方案, 销售组织, 招销售负责人, quota, 激励]
    always_involve: [sales_revops, personnel, finance]
    required_gate: sales_owner_or_gap_required
  - id: channel_partner_agreement_always_involve_hubu_and_xingbu
    when: [渠道协议, 代理分成, 经销, 客户归属, 渠道冲突, 伙伴协议]
    always_involve: [channel_partner, finance, justice]
    required_gate: external_commitment_requires_xingbu_review
    human_confirmation: true
  - id: ai_sales_message_requires_rites_review_and_human_confirmation
    when: [AI 销售, AI Sales, AI agent, 自动发消息, 自动跟进, 客户消息]
    always_involve: [sales_revops, ritual, justice]
    required_gate: no_auto_send_customer_message
    human_confirmation: true

user_choices:
  - brief
  - management_detail
  - professional_detail
  - enter_junjichu_deep_review
  - generate_sales_artifact
  - request_department_review
  - generate_followup_message
  - generate_quote_checklist
  - generate_account_plan
  - check_deal_risk

non_negotiable_floor:
  - high_risk_requires_human_confirmation
  - hubu_review_for_quote_discount_roi
  - xingbu_review_for_contract_commitment_exclusivity
  - rites_review_for_external_message
  - jinyiwei_review_for_customer_claim_or_competitor_claim
  - source_label_required
  - evidence_or_gap_required
  - no_auto_send_customer_message
