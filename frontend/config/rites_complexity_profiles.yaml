id: rites_complexity_profiles_v1
department_id: ritual
purpose: >
  礼部按公司规模、品牌/营销成熟度、对外风险和用户偏好自适应运行深度。
  自适应只调整披露表面（mode、默认展示深度、默认启用子司、是否暴露 8 子司结构），
  不调整风险地板。高风险对外表达自动升维，与公司规模无关，用户不可关闭。
  本配置不创建多套礼部流程，仍复用 rites_brand_comms_office_loop_v1 与统一朝堂 Loop。

modes:
  - mode: founder_expression_assistant
    headcountBand: "1-10"
    display_name: 老板表达助手模式
    defaultView: brief
    exposeSubOfficeStructure: false
    enabledSubOffices: [rites_cmo_cco_chief, rites_message_quality_gate]
    lightweightSubOffices: [rites_content_copy, rites_partnership_pitch]
    high_risk_extra_offices: [rites_pr_reputation, rites_message_quality_gate]
    supported_scenarios: [客户回复, 公司介绍, 产品介绍, 官网一句话, 朋友圈/公众号草稿, 简单招商话术]

  - mode: small_team_marketing
    headcountBand: "10-50"
    display_name: 小团队市场/销售支持模式
    defaultView: management_detail
    exposeSubOfficeStructure: false
    enabledSubOffices: [rites_cmo_cco_chief, rites_content_copy, rites_partnership_pitch, rites_message_quality_gate]
    lightweightSubOffices: [rites_brand_strategy, rites_customer_insight, rites_pr_reputation, rites_channel_campaign]
    supported_scenarios: [客户沟通, 销售材料, 招商话术, 品牌基础, 内容草稿]

  - mode: growth_cmo
    headcountBand: "50-200"
    display_name: 成长型 CMO 模式
    defaultView: management_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [rites_cmo_cco_chief, rites_brand_strategy, rites_customer_insight, rites_content_copy, rites_partnership_pitch, rites_pr_reputation, rites_channel_campaign, rites_message_quality_gate]
    supported_scenarios: [品牌定位, 客户分层, 销售材料体系, 招商材料, 活动内容, 公关基础]

  - mode: cmo_cco
    headcountBand: "200-1000"
    display_name: CMO/CCO 模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [rites_cmo_cco_chief, rites_brand_strategy, rites_customer_insight, rites_content_copy, rites_partnership_pitch, rites_pr_reputation, rites_channel_campaign, rites_message_quality_gate]
    supported_scenarios: [品牌战略, 传播节奏, 舆情风险, 营销协同, 内容治理, 危机预案]

  - mode: enterprise_brand_comms
    headcountBand: "1000+"
    display_name: 集团品牌传播模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [rites_cmo_cco_chief, rites_brand_strategy, rites_customer_insight, rites_content_copy, rites_partnership_pitch, rites_pr_reputation, rites_channel_campaign, rites_message_quality_gate]
    reservedCapabilities: [Brand_Architecture, Regional_Comms, Global_PR, Marketing_Ops, PR_Governance, AI_Content_Governance]
    note: 当前只预留架构，不实现完整集团能力。
    supported_scenarios: [品牌架构, 区域传播, 全球公关, Marketing Ops, PR governance, AI 内容治理]

escalation_rules:
  - id: formal_quote_message_always_involve_hubu_and_xingbu
    when: [正式报价, 报价话术, 报价邮件, 价格承诺]
    always_involve: [finance, justice, rites_message_quality_gate]
    human_confirmation: true
  - id: roi_or_revenue_claim_always_involve_hubu_and_xingbu
    when: [ROI, 收益, 回报, 收入承诺, 保底收益, 回本]
    always_involve: [finance, justice, rites_message_quality_gate]
    human_confirmation: true
  - id: legal_contract_or_exclusivity_claim_always_involve_xingbu
    when: [合同, 股权, 独家, 排他, 付款, 法律责任, 对外承诺]
    always_involve: [justice, rites_message_quality_gate]
    human_confirmation: true
  - id: crisis_or_media_statement_always_escalate
    when: [危机, 舆情, 媒体声明, 采访, 客户投诉, 负面传播]
    always_involve: [rites_pr_reputation, justice, junjichu]
    human_confirmation: true
  - id: competitor_claims_require_evidence_and_review
    when: [竞品, 对比, 贬低, 不专业, 行业第一, 唯一, 最强]
    always_involve: [rites_pr_reputation, justice, jinyiwei]
  - id: customer_commitment_requires_xingbu_review
    when: [客户承诺, 保证, 一定, 必须, 确认给客户]
    always_involve: [justice, rites_message_quality_gate]
    human_confirmation: true
  - id: delivery_or_capability_claim_requires_relevant_department_review
    when: [交期, 交付能力, 产能, 技术能力, 可实现, 30天交付]
    always_involve: [works, justice, rites_message_quality_gate]
  - id: ai_generated_external_content_requires_review
    when: [AI生成, 自动生成, 直接发, 公众号, 邮件, 对外文案]
    always_involve: [rites_message_quality_gate]
  - id: sensitive_data_requires_permission_guard
    when: [客户隐私, 员工隐私, 合作方隐私, 客户案例, 客户Logo, 个人信息]
    always_apply: privacy_sensitive_data_guard

user_choices:
  - brief
  - management_detail
  - professional_detail
  - enter_junjichu_deep_review
  - generate_artifact
  - request_department_review
  - generate_variants
  - rewrite_for_audience
  - check_message_risk

non_negotiable_floor:
  - high_risk_requires_human_confirmation
  - xingbu_review_for_external_commitment
  - hubu_review_for_roi_or_quote_claim
  - source_label_required
  - evidence_or_gap_required
  - message_quality_gate
  - privacy_sensitive_data_guard
  - no_auto_send_external_content
