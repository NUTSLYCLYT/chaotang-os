id: libu_complexity_profiles_v1
department_id: personnel
purpose: >
  吏部按公司规模 / 管理成熟度 / 问题风险 / 用户偏好自适应运行深度。
  自适应只调"披露表面"（默认 mode、默认展示深度、默认启用子司、是否暴露子司结构）；
  绝不调"风险地板"（升维规则 + 不可绕过底线），地板与公司规模无关，对所有 mode 强制生效。
  本配置不创建多套吏部流程，仍复用 libu_chro_cao_office_loop_v1 与统一朝堂 Loop。

# ── 5 个自适应模式（只决定表面）──────────────────────────
modes:
  - mode: founder_assistant
    headcountBand: "1-10"
    display_name: 老板助理模式
    defaultView: brief
    exposeSubOfficeStructure: false
    enabledSubOffices: [chro_cao_chief]
    lightweightSubOffices: [talent_acquisition, hr_operations, admin_operations]
    high_risk_extra_offices: [employee_relations]   # 高风险时叠加（不可关）
    supported_scenarios: [要不要招人, JD, 试用期, 转正, 离职交接, 基础合同, 行政提醒]

  - mode: small_team_hr
    headcountBand: "10-50"
    display_name: 小团队 HR 经理模式
    defaultView: management_detail
    exposeSubOfficeStructure: false
    enabledSubOffices: [chro_cao_chief, talent_acquisition, performance, total_rewards, hr_operations, employee_relations, admin_operations]
    lightweightSubOffices: [org_design]
    supported_scenarios: [招聘, 绩效/转正, 薪酬成本, 劳动风险, 行政事务]

  - mode: growth_hrd
    headcountBand: "50-200"
    display_name: 成长型 HRD 模式
    defaultView: management_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [chro_cao_chief, org_design, talent_acquisition, performance, total_rewards, hr_operations, employee_relations, admin_operations]
    supported_scenarios: [组织架构, 招聘管线, 绩效, 薪酬, 员工关系, 行政保障]

  - mode: chro_cao
    headcountBand: "200-1000"
    display_name: 中型企业 CHRO/CAO 模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [chro_cao_chief, org_design, talent_acquisition, performance, total_rewards, hr_operations, employee_relations, admin_operations]
    supported_scenarios: [组织诊断, 干部盘点, 薪酬公平性, 劳动风险, 行政费用异常]

  - mode: group_enterprise
    headcountBand: "1000+"
    display_name: 集团模式
    defaultView: professional_detail
    exposeSubOfficeStructure: true
    enabledSubOffices: [chro_cao_chief, org_design, talent_acquisition, performance, total_rewards, hr_operations, employee_relations, admin_operations]
    reservedCapabilities: [HRBP, COE, SSC, People_Analytics, AI_Workforce_Governance]
    note: 当前只预留架构，不实现完整集团能力。
    supported_scenarios: [组织诊断, 干部盘点, 薪酬公平性, 劳动风险, 行政费用异常]

# ── 高风险自动升维规则（地板，与 mode 无关，永远生效）──────
escalation_rules:
  - id: termination_or_discipline_always_escalate
    when: [辞退, 解除, 处分, 降级, 调岗]
    always_involve: [employee_relations, justice]
    human_confirmation: true
  - id: compensation_always_involve_hubu
    when: [薪酬, 调薪, 奖金, 提成, 年终奖]
    always_involve: [total_rewards, finance]
  - id: labor_risk_always_involve_xingbu
    when: [劳动风险, 纠纷, 竞业, 仲裁, 投诉, 离职谈判]
    always_involve: [employee_relations, justice]
  - id: sales_role_always_involve_bingbu
    when: [销售岗位, 大客户销售, 销售负责人]
    always_involve: [talent_acquisition, war]
  - id: admin_cost_always_involve_hubu
    when: [行政采购, 行政费用, 搬迁, 租赁]
    always_involve: [admin_operations, finance]
  - id: lease_or_contract_admin_always_involve_xingbu
    when: [租赁合同, 行政合同, 证照, 印章]
    always_involve: [admin_operations, justice]
  - id: ai_agent_role_always_involve_junjichu_and_xingbu
    when: [AI Agent, 蜂群岗位, AI 劳动力]
    always_involve: [junjichu, justice, jinyiwei]
    human_confirmation: true
  - id: privacy_sensitive_data_requires_permission_guard
    when: [薪酬, 健康, 纪律, 投诉, 离职意向, 个人隐私]
    always_apply: privacy_sensitive_data_guard

# ── 用户可选（披露表面，可自由升降）──────────────────────
user_choices:
  - brief
  - management_detail
  - professional_detail
  - enter_junjichu_deep_review
  - generate_artifact
  - request_department_review

# ── 用户不可绕过（风险地板，任何 mode/规模都锁死）──────────
non_negotiable_floor:
  - high_risk_requires_human_confirmation
  - xingbu_review_for_labor_risk
  - hubu_review_for_compensation_or_admin_cost
  - source_label_required
  - evidence_or_gap_required
  - privacy_sensitive_data_guard
