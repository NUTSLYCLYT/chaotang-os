# 朝堂 AI 盒子 · 编排(2026-06-25) — 见 docs/BOX-PACKAGING.md
# 单机私有盒子:web + jiqun(蜂群/执行) + litellm(模型网关) + 持久卷。
# ⚠️ 交付前过一次真渗透;FENGQUN_AUTH=true 是安全命脉。
services:
  web:
    build: .                      # 本仓 Dockerfile(Next standalone + CJK 字体)
    ports:
      # 仅绑 127.0.0.1(本机/nginx 反代),不对外 0.0.0.0 裸奔。军工内网:由前置 nginx/内网网关接。
      - "127.0.0.1:3050:3000"     # 容器内 3000 → 本机 3050(仅唯一对外入口)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: real
      JIQUN_API_URL: http://jiqun:8081
      OPENAI_BASE_URL: http://litellm:4444/v1   # 模型网关(见 §0 本地/云)
      # 密钥经 .env 注入,不写死(OPENAI_API_KEY 等)
    env_file:
      - .env.box                  # 客户密钥/配置(不入库·不入镜像)
    volumes:
      - ./data:/app/data:ro       # 真数据快照运行时挂载(只读·绝不打进镜像)
      - chaotang-db:/app/.data    # 决策/史馆库持久卷
    depends_on:
      - jiqun
      - litellm
    restart: unless-stopped

  jiqun:
    # 后端与前端共用 chaotang-os monorepo；构建上下文固定为根级 backend/。
    # 内部服务:不发布端口到主机(只 web 经 compose 内网 jiqun:8081 可达)。
    # 发布端口=蜂群后端公网裸奔、绕过 web 层鉴权 → 安全审查已拦,勿加 ports。
    build: ../backend
    expose:
      - "8081"                    # 仅 compose 内网暴露,不绑主机
    environment:
      FENGQUN_AUTH: "true"        # 🔴 安全命脉:=false 则 court/* 全裸奔(伪造token穿墙)。盒子红线,勿改。
    env_file:
      - .env.box
    restart: unless-stopped

  litellm:
    # 模型网关:接本地量化模型(军工·数据不出门)或云 API(普通企业)。见 docs/BOX-PACKAGING.md §0。
    image: ghcr.io/berriai/litellm:main-latest
    # 内部服务:不发布端口(只 web 经 compose 内网 litellm:4444 可达)。
    # 发布端口=LLM 网关公网裸奔、绕过 web 鉴权可刷 token → 安全审查已拦,勿加 ports。
    expose:
      - "4444"
    command: ["--config", "/app/litellm.config.yaml", "--port", "4444"]
    volumes:
      - ./litellm.config.yaml:/app/litellm.config.yaml:ro
    env_file:
      - .env.box
    restart: unless-stopped

volumes:
  chaotang-db:
