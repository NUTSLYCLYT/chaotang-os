## LiteLLM Source Config Template — 脱敏版
## 真实配置在 ~/.openclaw/litellm_config.yaml（含 API key，不进 git）
## 恢复步骤：
##   cp deploy/litellm-config.template.yaml ~/.openclaw/litellm_config.yaml
##   然后手动填写所有 <FILL_IN> 字段（API key）
##   systemctl --user restart litellm
##
## NOTE: 这是 SOURCE。render-litellm-config.py 生成运行时文件。

general_settings:
  master_key: "<FILL_IN>"   # 对应前端 OPENAI_API_KEY，最好用 openssl rand -hex 32 生成
  max_parallel_requests: 16

router_settings:
  routing_strategy: least-busy
  cooldown_time: 30
  allowed_fails: 3
  enable_pre_call_checks: true
  timeout: 60

litellm_settings:
  cache: true
  disable_end_user_cost_tracking_prometheus_only: true
  drop_params: true
  modify_params: true
  json_logs: true
  log_file: /home/ubuntu/.openclaw/log/litellm_spend.log
  num_retries: 2
  request_timeout: 60
  success_callback:
  - log_to_file
  - arize_phoenix
  callbacks:
  - arize_phoenix
  - hermes_difficulty_router.proxy_handler_instance
  telemetry: false
  turn_off_message_logging: true
  cache_params:
    type: local
    ttl: 3600
    namespace: openclaw.litellm

  fallbacks:
  - swarm-judge:     [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-strong:    [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-coder:     [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-haiku:     [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-review:    [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-worker:    [claude-haiku-4-5, deepseek-v4-flash]
  - swarm-quick:     [deepseek-v4-flash]
  - hermes-business: [deepseek-v4-pro, glm-5, claude-haiku-4-5, deepseek-v4-flash]
  - hermes-chat:     [claude-haiku-4-5, deepseek-v4-flash]
  - codex:             [codex-gpt-5.4, deepseek-v4-pro]
  - codex-gpt-5.5:     [codex-gpt-5.4, deepseek-v4-pro]
  - codex-gpt-5.4:     [codex-gpt-5.3, deepseek-v4-pro]
  - codex-gpt-5.3:     [deepseek-v4-pro]
  - claude-opus-4-8:   [claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5, deepseek-v4-flash]
  - claude-opus-4-7:   [claude-sonnet-4-6, claude-haiku-4-5, deepseek-v4-flash]
  - claude-sonnet-4-6: [claude-haiku-4-5, deepseek-v4-flash]
  - claude-haiku-4-5:  [deepseek-v4-flash]
  - deepseek-v4-pro:      [minimax-m3, claude-sonnet-4-6, deepseek-v4-flash]
  - deepseek-v4-flash:    [minimax-m3, claude-haiku-4-5]
  - minimax-m3:           [deepseek-v4-pro, claude-sonnet-4-6, claude-haiku-4-5]
  - glm-5:               [claude-haiku-4-5, deepseek-v4-flash]

model_list:

# ─── Claude (via local OAuth proxy :8767) ──────────────────────────
# api_base: http://127.0.0.1:8767  ← Claude OAuth proxy
# api_key: <FILL_IN>               ← OAuth proxy auth token

- model_name: swarm-judge
  litellm_params:
    model: anthropic/claude-haiku-4-5
    api_base: http://127.0.0.1:8767
    api_key: "<FILL_IN>"
    timeout: 120
    max_tokens: 4096
    extra_headers:
      anthropic-beta: claude-code-20250219,oauth-2025-04-20
      anthropic-version: "2023-06-01"

