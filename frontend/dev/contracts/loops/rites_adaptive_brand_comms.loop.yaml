id: rites_adaptive_brand_comms_loop_v1
name: 礼部自适应复杂度子循环
version: 0.1.0
owner: courtos/rites_brand_comms
purpose: >
  礼部按公司规模、品牌/营销成熟度、对外风险和用户偏好自适应运行深度。
  这是 rites_brand_comms_office_loop_v1 之上的自适应包装，不替代它，不创建小公司/集团等多套流程。
  仍作为统一朝堂 Loop (court_unified_decision_loop_v1) 的可插拔部门能力。
  铁律：自适应只调披露表面；高风险升维与不可绕过底线永远生效。

composes:
  - rites_brand_comms_office_loop_v1
plugs_into:
  - court_unified_decision_loop_v1

entrypoints:
  - enabled_department_review.ritual
  - junjichu_department_work_order.ritual

steps:
  - id: load_company_brand_profile
    name: 载入公司品牌传播画像
    skill: skill.rites_brand_comms.load_company_brand_profile
    inputs: [company_brand_comms_profile]
    outputs: [CompanyBrandCommsProfileV1]

  - id: determine_rites_mode
    name: 判定礼部模式
    skill: skill.rites_brand_comms.determine_rites_mode
    rule: 按 employeeCount/headcountBand、brandMaturity、marketingMaturity 映射 config/rites_complexity_profiles.yaml 的 5 个 mode；用户偏好可微调展示深度，但不改风险地板。
    outputs: [RitesComplexityProfileV1]

  - id: classify_brand_comms_question
    name: 品牌传播问题分类
    skill: skill.rites_brand_comms.classify_brand_comms_question
    outputs: [brand_comms_question_type, message_risk_watchlist]

  - id: apply_message_risk_escalation_rules
    name: 应用表达风险自动升维
    skill: skill.rites_brand_comms.apply_message_risk_escalation_rules
    rule: 不论 mode/规模，命中升维条件即强制叠加对应子司与跨部复核，用户不可关闭。
    escalation_rules:
      - formal_quote_message_always_involve_hubu_and_xingbu
      - roi_or_revenue_claim_always_involve_hubu_and_xingbu
      - legal_contract_or_exclusivity_claim_always_involve_xingbu
      - crisis_or_media_statement_always_escalate
      - competitor_claims_require_evidence_and_review
      - customer_commitment_requires_xingbu_review
      - delivery_or_capability_claim_requires_relevant_department_review
      - ai_generated_external_content_requires_review
      - sensitive_data_requires_permission_guard
    outputs: [escalation_applied]

  - id: select_enabled_sub_offices
    name: 选择启用子司
    skill: skill.rites_brand_comms.select_enabled_sub_offices
    rule: 取 mode.enabledSubOffices ∪ escalation 强制叠加的子司（升维永远叠加，不被 mode 削减）。
    outputs: [active_sub_offices]
    delegates_to: rites_brand_comms_office_loop_v1

  - id: render_adaptive_interaction
    name: 渲染自适应交互
    skill: skill.rites_brand_comms.render_adaptive_interaction
    rule: >
      按 mode.defaultView 决定默认展示深度。小公司默认 brief 且不暴露 8 子司结构；
      中大型默认可展开专业分奏。用户可在 user_choices 内自由升降，但 lockedFloor 不可绕过。
    user_choices: [brief, management_detail, professional_detail, enter_junjichu_deep_review, generate_artifact, request_department_review, generate_variants, rewrite_for_audience, check_message_risk]
    locked_floor: [high_risk_requires_human_confirmation, xingbu_review_for_external_commitment, hubu_review_for_roi_or_quote_claim, source_label_required, evidence_or_gap_required, message_quality_gate, privacy_sensitive_data_guard, no_auto_send_external_content]
    outputs: [RitesAdaptiveInteractionV1]

  - id: quality_gate
    name: 礼部自适应质门
    skill: skill.rites_brand_comms.adaptive_quality_gate
    gates:
      - source_label_required
      - high_risk_requires_human_confirmation
      - xingbu_review_for_external_commitment
      - hubu_review_for_roi_or_quote_claim
      - evidence_or_gap_required
      - message_quality_gate
      - privacy_sensitive_data_guard
      - no_auto_send_external_content
    rule: 高风险事项 humanConfirmationRequired=true，用户不可关闭；地板缺失即 block。
