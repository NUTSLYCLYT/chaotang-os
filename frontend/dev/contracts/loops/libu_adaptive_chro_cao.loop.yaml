id: libu_adaptive_chro_cao_loop_v1
name: 吏部自适应复杂度子循环
version: 0.1.0
owner: courtos/libu
purpose: >
  吏部按公司规模 / 管理成熟度 / 问题风险 / 用户偏好自适应运行深度。
  这是 libu_chro_cao_office_loop_v1 之上的"自适应包装"，不替代它、不创建多套 per-size 流程。
  仍作为统一朝堂 Loop (court_unified_decision_loop_v1) 的可插拔部门能力。
  铁律：自适应只调披露表面（mode/展示深度/默认子司）；风险地板（升维+不可绕过底线）与规模无关，永远生效。

composes:
  - libu_chro_cao_office_loop_v1     # 复用既有子司会审，不重写
plugs_into:
  - court_unified_decision_loop_v1

entrypoints:
  - enabled_department_review.personnel
  - junjichu_department_work_order.personnel

steps:
  - id: load_company_profile
    name: 载入公司画像
    skill: skill.libu.load_company_profile
    inputs: [company_people_admin_profile]
    outputs: [CompanyPeopleAdminProfileV1]

  - id: determine_libu_mode
    name: 判定吏部模式
    skill: skill.libu.determine_libu_mode
    rule: 按 employeeCount/headcountBand 映射 config/libu_complexity_profiles.yaml 的 5 个 mode；用户偏好可微调展示深度，但不改地板。
    outputs: [LibuComplexityProfileV1]

  - id: classify_people_admin_question
    name: 人力行政问题分类
    skill: skill.libu.classify_people_admin_question
    outputs: [people_admin_question_type, risk_watchlist]

  - id: apply_escalation_rules
    name: 应用高风险自动升维
    skill: skill.libu.apply_escalation_rules
    rule: >
      不论 mode/规模，命中升维条件即强制叠加对应子司与跨部复核，用户不可关闭。
    escalation_rules:
      - termination_or_discipline_always_escalate     # 辞退/处分/降薪/调岗 → 劳关司+刑部 + 人工确认
      - compensation_always_involve_hubu              # 薪酬/奖金/提成/调薪 → 薪酬司+户部
      - labor_risk_always_involve_xingbu              # 劳动纠纷/竞业/离职谈判/投诉 → 劳关司+刑部
      - sales_role_always_involve_bingbu              # 销售关键岗位 → 选才司+兵部
      - admin_cost_always_involve_hubu                # 行政采购/费用 → 行政司+户部
      - lease_or_contract_admin_always_involve_xingbu # 租赁/行政合同/证照 → 行政司+刑部
      - ai_agent_role_always_involve_junjichu_and_xingbu # AI Agent/蜂群岗位 → 军机处+刑部+锦衣卫 + 人工确认
      - privacy_sensitive_data_requires_permission_guard # 隐私/薪酬/健康/纪律/离职意向 → 隐私权限检查
    outputs: [escalation_applied]

  - id: select_enabled_sub_offices
    name: 选择启用子司
    skill: skill.libu.select_enabled_sub_offices
    rule: 取 mode.enabledSubOffices ∪ escalation 强制叠加的子司（升维永远叠加，不被 mode 削减）。
    outputs: [active_sub_offices]
    delegates_to: libu_chro_cao_office_loop_v1   # 实际子司会审复用既有子循环

  - id: render_adaptive_interaction
    name: 渲染自适应交互
    skill: skill.libu.render_adaptive_interaction
    rule: >
      按 mode.defaultView 决定默认展示深度（brief / management_detail / professional_detail）；
      小公司默认 brief 且不暴露 8 子司结构；中大型默认可展开专业分奏。
      用户可在 user_choices 内自由升降，但 lockedFloor 不可绕过。
    user_choices: [brief, management_detail, professional_detail, enter_junjichu_deep_review, generate_artifact, request_department_review]
    locked_floor: [high_risk_requires_human_confirmation, xingbu_review_for_labor_risk, hubu_review_for_compensation_or_admin_cost, source_label_required, evidence_or_gap_required, privacy_sensitive_data_guard]
    outputs: [LibuAdaptiveInteractionV1]

  - id: quality_gate
    name: 吏部质门（含地板强校验）
    skill: skill.libu.adaptive_quality_gate
    gates:
      - source_label_required
      - high_risk_requires_human_confirmation
      - xingbu_review_for_labor_risk
      - hubu_review_for_compensation_or_admin_cost
      - evidence_or_gap_required
      - privacy_sensitive_data_guard
      - no_irreversible_hr_action_without_approval
    rule: 高风险事项 humanConfirmationRequired=true，用户不可关闭；地板缺失即 block。
